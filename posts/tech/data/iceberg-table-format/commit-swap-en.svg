<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-labelledby="swap-title">
  <title id="swap-title">An Iceberg commit writes a new metadata file and then swaps the catalog pointer</title>
  <defs>
    <marker id="swap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; }
    .d-small { fill: var(--secondary); font: 12px sans-serif; }
    .d-head { fill: var(--primary); font: bold 15px sans-serif; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-accent { fill: rgba(70, 130, 220, 0.18); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-warm { fill: rgba(230, 140, 50, 0.18); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-dash { stroke: var(--secondary); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .d-warm-dash { fill: rgba(230, 140, 50, 0.10); stroke: rgb(220, 130, 40); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .d-accent-dash { fill: rgba(70, 130, 220, 0.10); stroke: rgb(70, 130, 220); stroke-width: 1.5; stroke-dasharray: 5 3; }
  </style>
  <rect class="d-box" x="10" y="115" width="120" height="70" rx="6"/>
  <text class="d-head" x="22" y="142">catalog</text>
  <text class="d-small" x="22" y="166">db.events</text>
  <rect class="d-box" x="210" y="30" width="180" height="70" rx="6"/>
  <text class="d-head" x="222" y="56">metadata v1</text>
  <text class="d-small" x="222" y="80">snapshot S1</text>
  <rect class="d-accent" x="210" y="200" width="180" height="70" rx="6"/>
  <text class="d-head" x="222" y="226">metadata v2</text>
  <text class="d-small" x="222" y="250">snapshots S1, S2 (current)</text>
  <line class="d-dash" x1="130" y1="135" x2="206" y2="70" marker-end="url(#swap-arrow)"/>
  <text class="d-small" x="120" y="92">before</text>
  <line class="d-line" x1="130" y1="165" x2="206" y2="230" marker-end="url(#swap-arrow)"/>
  <text class="d-small" x="120" y="216">after</text>
  <rect class="d-box" x="520" y="40" width="110" height="40" rx="4"/>
  <text class="d-text" x="532" y="65">data 1</text>
  <rect class="d-box" x="520" y="110" width="110" height="40" rx="4"/>
  <text class="d-text" x="532" y="135">data 2</text>
  <rect class="d-accent" x="520" y="210" width="110" height="40" rx="4"/>
  <text class="d-text" x="532" y="235">data 3</text>
  <text class="d-small" x="642" y="235">new in this commit</text>
  <line class="d-dash" x1="390" y1="60" x2="516" y2="60" marker-end="url(#swap-arrow)"/>
  <line class="d-dash" x1="390" y1="75" x2="516" y2="125" marker-end="url(#swap-arrow)"/>
  <line class="d-line" x1="390" y1="220" x2="516" y2="70" marker-end="url(#swap-arrow)"/>
  <line class="d-line" x1="390" y1="232" x2="516" y2="135" marker-end="url(#swap-arrow)"/>
  <line class="d-line" x1="390" y1="245" x2="516" y2="230" marker-end="url(#swap-arrow)"/>
  <text class="d-text" x="10" y="300">Manifests are omitted. After the new metadata is written, swapping the pointer is the commit</text>
</svg>
