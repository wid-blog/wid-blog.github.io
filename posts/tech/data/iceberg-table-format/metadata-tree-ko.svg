<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-labelledby="tree-title">
  <title id="tree-title">catalog 에서 metadata 파일, manifest list, manifest 를 거쳐 data file 로 내려가는 Iceberg 표 구조</title>
  <defs>
    <marker id="tree-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; }
    .d-small { fill: var(--secondary); font: 12px sans-serif; }
    .d-head { fill: var(--primary); font: bold 15px sans-serif; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-accent { fill: rgba(70, 130, 220, 0.18); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-warm { fill: rgba(230, 140, 50, 0.18); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-dash { stroke: var(--secondary); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .d-warm-dash { fill: rgba(230, 140, 50, 0.10); stroke: rgb(220, 130, 40); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .d-accent-dash { fill: rgba(70, 130, 220, 0.10); stroke: rgb(70, 130, 220); stroke-width: 1.5; stroke-dasharray: 5 3; }
  </style>
  <rect class="d-box" x="10" y="90" width="130" height="80" rx="6"/>
  <text class="d-head" x="22" y="116">catalog</text>
  <text class="d-small" x="22" y="140">표 이름 →</text>
  <text class="d-small" x="22" y="158">현재 metadata 위치</text>
  <rect class="d-accent" x="170" y="70" width="160" height="120" rx="6"/>
  <text class="d-head" x="182" y="96">metadata 파일</text>
  <text class="d-small" x="182" y="122">스키마, partition spec</text>
  <text class="d-small" x="182" y="142">snapshot 목록</text>
  <text class="d-small" x="182" y="162">현재 snapshot</text>
  <rect class="d-accent" x="360" y="90" width="130" height="80" rx="6"/>
  <text class="d-head" x="372" y="116">manifest list</text>
  <text class="d-small" x="372" y="140">snapshot 마다 하나,</text>
  <text class="d-small" x="372" y="158">manifest 를 나열</text>
  <rect class="d-accent" x="520" y="30" width="120" height="80" rx="6"/>
  <text class="d-head" x="532" y="56">manifest</text>
  <text class="d-small" x="532" y="80">파일별 파티션 값</text>
  <text class="d-small" x="532" y="98">열 통계(최솟값 등)</text>
  <rect class="d-accent" x="520" y="160" width="120" height="80" rx="6"/>
  <text class="d-head" x="532" y="186">manifest</text>
  <text class="d-small" x="532" y="210">파일별 파티션 값</text>
  <text class="d-small" x="532" y="228">열 통계(최솟값 등)</text>
  <rect class="d-box" x="670" y="30" width="80" height="35" rx="4"/>
  <text class="d-text" x="682" y="53">data 1</text>
  <rect class="d-box" x="670" y="75" width="80" height="35" rx="4"/>
  <text class="d-text" x="682" y="98">data 2</text>
  <rect class="d-box" x="670" y="160" width="80" height="35" rx="4"/>
  <text class="d-text" x="682" y="183">data 3</text>
  <rect class="d-box" x="670" y="205" width="80" height="35" rx="4"/>
  <text class="d-text" x="682" y="228">data 4</text>
  <line class="d-line" x1="140" y1="130" x2="166" y2="130" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="330" y1="130" x2="356" y2="130" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="490" y1="120" x2="516" y2="75" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="490" y1="140" x2="516" y2="200" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="640" y1="60" x2="666" y2="47" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="640" y1="80" x2="666" y2="92" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="640" y1="190" x2="666" y2="177" marker-end="url(#tree-arrow)"/>
  <line class="d-line" x1="640" y1="210" x2="666" y2="222" marker-end="url(#tree-arrow)"/>
  <text class="d-text" x="10" y="280">읽기는 catalog 에서 data file 쪽으로 진행하고, manifest 통계로 걸러지지 않은 파일만 연다</text>
</svg>
