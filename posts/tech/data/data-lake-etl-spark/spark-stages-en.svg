<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-labelledby="spark-title-en">
  <title id="spark-title-en">Spark driver and executors, with two stages split at a shuffle</title>
  <defs>
    <marker id="spark-arrow-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; }
    .d-small { fill: var(--secondary); font: 12px sans-serif; }
    .d-head { fill: var(--primary); font: bold 15px sans-serif; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-accent { fill: rgba(70, 130, 220, 0.18); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-warm { fill: rgba(230, 140, 50, 0.18); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-line { stroke: var(--secondary); stroke-width: 1.3; fill: none; }
    .d-dash { stroke: rgb(220, 130, 40); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
  </style>

  <rect class="d-box" x="270" y="12" width="220" height="50" rx="6"/>
  <text class="d-head" x="282" y="34">driver</text>
  <text class="d-small" x="282" y="52">Builds the plan, hands out tasks</text>

  <text class="d-head" x="20" y="96">Stage 1: read files, filter</text>
  <rect class="d-accent" x="20" y="108" width="150" height="40" rx="4"/>
  <text class="d-text" x="32" y="133">partition 1 → task</text>
  <rect class="d-accent" x="20" y="156" width="150" height="40" rx="4"/>
  <text class="d-text" x="32" y="181">partition 2 → task</text>
  <rect class="d-accent" x="20" y="204" width="150" height="40" rx="4"/>
  <text class="d-text" x="32" y="229">partition 3 → task</text>
  <text class="d-small" x="20" y="268">Each partition is processed</text>
  <text class="d-small" x="20" y="286">on its own (narrow)</text>

  <line class="d-dash" x1="380" y1="90" x2="380" y2="300"/>
  <text class="d-small" x="270" y="318">Shuffle: disk writes, serialization, network transfer</text>

  <text class="d-head" x="560" y="96">Stage 2: groupBy</text>
  <rect class="d-warm" x="560" y="128" width="180" height="40" rx="4"/>
  <text class="d-text" x="572" y="153">hash(user_id) 0 → task</text>
  <rect class="d-warm" x="560" y="184" width="180" height="40" rx="4"/>
  <text class="d-text" x="572" y="209">hash(user_id) 1 → task</text>
  <text class="d-small" x="560" y="268">Rows with the same key must</text>
  <text class="d-small" x="560" y="286">meet in one task (wide)</text>

  <line class="d-line" x1="170" y1="128" x2="556" y2="148" marker-end="url(#spark-arrow-en)"/>
  <line class="d-line" x1="170" y1="128" x2="556" y2="204" marker-end="url(#spark-arrow-en)"/>
  <line class="d-line" x1="170" y1="176" x2="556" y2="148" marker-end="url(#spark-arrow-en)"/>
  <line class="d-line" x1="170" y1="176" x2="556" y2="204" marker-end="url(#spark-arrow-en)"/>
  <line class="d-line" x1="170" y1="224" x2="556" y2="148" marker-end="url(#spark-arrow-en)"/>
  <line class="d-line" x1="170" y1="224" x2="556" y2="204" marker-end="url(#spark-arrow-en)"/>
</svg>
