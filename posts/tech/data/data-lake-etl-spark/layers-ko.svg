<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" role="img" aria-labelledby="layers-title">
  <title id="layers-title">원천에서 raw, staging, mart 를 거쳐 소비자로 가는 데이터 흐름</title>
  <defs>
    <marker id="layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; }
    .d-small { fill: var(--secondary); font: 12px sans-serif; }
    .d-head { fill: var(--primary); font: bold 15px sans-serif; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-accent { fill: rgba(70, 130, 220, 0.18); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
  </style>

  <rect class="d-box" x="10" y="40" width="120" height="120" rx="6"/>
  <text class="d-head" x="22" y="66">원천</text>
  <text class="d-small" x="22" y="92">서비스 DB</text>
  <text class="d-small" x="22" y="112">이벤트 로그</text>
  <text class="d-small" x="22" y="132">외부 export</text>

  <rect class="d-accent" x="170" y="40" width="160" height="120" rx="6"/>
  <text class="d-head" x="182" y="66">raw</text>
  <text class="d-small" x="182" y="92">받은 그대로 보존</text>
  <text class="d-small" x="182" y="112">추가만, 고치지 않음</text>
  <text class="d-small" x="182" y="132">재처리의 출발점</text>

  <rect class="d-accent" x="370" y="40" width="160" height="120" rx="6"/>
  <text class="d-head" x="382" y="66">staging</text>
  <text class="d-small" x="382" y="92">타입·이름 정리</text>
  <text class="d-small" x="382" y="112">중복·오류 행 제거</text>
  <text class="d-small" x="382" y="132">원천 단위 정제</text>

  <rect class="d-accent" x="570" y="40" width="170" height="120" rx="6"/>
  <text class="d-head" x="582" y="66">mart</text>
  <text class="d-small" x="582" y="92">질문 단위 집계</text>
  <text class="d-small" x="582" y="112">여러 원천 조인</text>
  <text class="d-small" x="582" y="132">이름·정의 고정</text>

  <line class="d-line" x1="130" y1="100" x2="166" y2="100" marker-end="url(#layers-arrow)"/>
  <line class="d-line" x1="330" y1="100" x2="366" y2="100" marker-end="url(#layers-arrow)"/>
  <line class="d-line" x1="530" y1="100" x2="566" y2="100" marker-end="url(#layers-arrow)"/>

  <text class="d-small" x="182" y="190">주 소비자: 파이프라인 자신</text>
  <text class="d-small" x="382" y="190">주 소비자: 데이터 엔지니어</text>
  <text class="d-small" x="582" y="190">주 소비자: 대시보드·분석·모델</text>
  <text class="d-text" x="190" y="236">앞 계층이 남아 있으면 뒤 계층은 언제든 다시 만들 수 있다</text>
</svg>
