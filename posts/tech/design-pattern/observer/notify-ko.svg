<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="obs-notify-title">
  <title id="obs-notify-title">Observer — Subject 의 상태가 바뀌면 등록된 Observer 마다 update() 를 호출한다</title>
  <style>
    .obs-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .obs-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .obs-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .obs-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .obs-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .obs-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .obs-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .obs-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .obs-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .obs-dash { stroke-dasharray: 5 4; }
    .obs-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .obs-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="obs-notify-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="obs-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="obs-life" x1="100" y1="56" x2="100" y2="190"/>
  <line class="obs-life" x1="280" y1="56" x2="280" y2="190"/>
  <line class="obs-life" x1="460" y1="56" x2="460" y2="190"/>
  <rect class="obs-blue" x="40" y="20" width="120" height="36" rx="8"/>
  <text class="obs-t" x="100" y="38">Subject</text>
  <rect class="obs-green" x="220" y="20" width="120" height="36" rx="8"/>
  <text class="obs-t" x="280" y="38">Observer A</text>
  <rect class="obs-green" x="400" y="20" width="120" height="36" rx="8"/>
  <text class="obs-t" x="460" y="38">Observer B</text>
  <rect class="obs-group" x="60" y="72" width="80" height="30" rx="6"/>
  <text class="obs-msg" x="100" y="87">상태 변경</text>
  <text class="obs-msg" x="190" y="119">update()</text>
  <line class="obs-line" x1="100" y1="130" x2="279" y2="130" marker-end="url(#obs-notify-arrow)"/>
  <text class="obs-msg" x="190" y="159">update()</text>
  <line class="obs-line" x1="100" y1="170" x2="459" y2="170" marker-end="url(#obs-notify-arrow)"/>
</svg>
