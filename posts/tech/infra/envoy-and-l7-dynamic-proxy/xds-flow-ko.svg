<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 314" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="evy-xds-flow-title">
  <title id="evy-xds-flow-title">xDS — Envoy 가 control plane 을 구독하고, endpoint 가 바뀌면 control plane 이 EDS 로 밀어준다</title>
  <style>
    .evy-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .evy-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .evy-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .evy-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .evy-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .evy-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .evy-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .evy-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .evy-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .evy-dash { stroke-dasharray: 5 4; }
    .evy-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .evy-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="evy-xds-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="evy-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="evy-life" x1="100" y1="56" x2="100" y2="294"/>
  <line class="evy-life" x1="280" y1="56" x2="280" y2="294"/>
  <line class="evy-life" x1="460" y1="56" x2="460" y2="294"/>
  <rect class="evy-green" x="20" y="20" width="160" height="36" rx="8"/>
  <text class="evy-t" x="100" y="38">Control Plane</text>
  <rect class="evy-blue" x="200" y="20" width="160" height="36" rx="8"/>
  <text class="evy-t" x="280" y="38">Envoy (data plane)</text>
  <rect class="evy-blue" x="380" y="20" width="160" height="36" rx="8"/>
  <text class="evy-t" x="460" y="38">Backend</text>
  <text class="evy-msg" x="190" y="73">gRPC stream subscribe</text>
  <text class="evy-msg" x="190" y="91">(LDS/CDS/RDS/EDS)</text>
  <line class="evy-line" x1="280" y1="102" x2="101" y2="102" marker-end="url(#evy-xds-flow-arrow)"/>
  <text class="evy-msg" x="190" y="131">Listener / Cluster /</text>
  <text class="evy-msg" x="190" y="149">Route / Endpoint</text>
  <line class="evy-line evy-dash" x1="100" y1="160" x2="279" y2="160" marker-end="url(#evy-xds-flow-arrow)"/>
  <rect class="evy-group" x="197" y="176" width="166" height="30" rx="6"/>
  <text class="evy-msg" x="280" y="191">Hot reload 없이 즉시 반영</text>
  <text class="evy-msg" x="370" y="223">Pod 추가/제거 이벤트</text>
  <line class="evy-line" x1="460" y1="234" x2="101" y2="234" marker-end="url(#evy-xds-flow-arrow)"/>
  <text class="evy-msg" x="190" y="263">EDS push (endpoint 변경)</text>
  <line class="evy-line evy-dash" x1="100" y1="274" x2="279" y2="274" marker-end="url(#evy-xds-flow-arrow)"/>
</svg>
