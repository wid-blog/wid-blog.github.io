<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 418" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="kzc-follower-fetching-title">
  <title id="kzc-follower-fetching-title">follower fetching 전후로 consumer 가 읽는 replica</title>
  <style>
    .kzc-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .kzc-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .kzc-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .kzc-left { text-anchor: start; }
    .kzc-right { text-anchor: end; }
    .kzc-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .kzc-node { fill: rgba(128, 128, 128, 0.10); stroke: var(--secondary); stroke-width: 1; }
    .kzc-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .kzc-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .kzc-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .kzc-bblue { fill: rgba(70, 130, 220, 0.55); }
    .kzc-bgreen { fill: rgba(60, 160, 90, 0.55); }
    .kzc-bamber { fill: rgba(220, 130, 40, 0.55); }
    .kzc-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .kzc-pblue { stroke: rgb(70, 130, 220); stroke-width: 2; fill: none; }
    .kzc-pgreen { stroke: rgb(60, 160, 90); stroke-width: 2; fill: none; }
    .kzc-pamber { stroke: rgb(220, 130, 40); stroke-width: 2; fill: none; }
    .kzc-dash { stroke-dasharray: 5 4; }
    .kzc-head { fill: var(--secondary); }
    .kzc-hblue { fill: rgb(70, 130, 220); }
    .kzc-hgreen { fill: rgb(60, 160, 90); }
    .kzc-hamber { fill: rgb(220, 130, 40); }
  </style>
  <defs>
    <marker id="kzc-follower-fetching-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path class="kzc-hamber" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="kzc-follower-fetching-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path class="kzc-hgreen" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>
  <text class="kzc-sub kzc-left" x="16" y="26">기본: leader 에서 읽는다</text>
  <rect class="kzc-group" x="16" y="40" width="200" height="166" rx="12"/>
  <text class="kzc-sub kzc-left" x="28" y="60">zone a</text>
  <rect class="kzc-group" x="264" y="40" width="200" height="166" rx="12"/>
  <text class="kzc-sub kzc-left" x="276" y="60">zone c</text>
  <rect class="kzc-node" x="40" y="76" width="150" height="36" rx="8"/>
  <text class="kzc-t" x="115.0" y="94.0">broker 1 · leader</text>
  <rect class="kzc-node" x="288" y="76" width="150" height="36" rx="8"/>
  <text class="kzc-t" x="363.0" y="94.0">broker 3 · follower</text>
  <rect class="kzc-green" x="288" y="136" width="150" height="56" rx="8"/>
  <text class="kzc-t" x="363.0" y="155.0">consumer</text>
  <text class="kzc-t" x="363.0" y="173.0">client.rack=c</text>
  <path class="kzc-pamber" d="M 190 94 L 287 94" marker-end="url(#kzc-follower-fetching-amber)"/>
  <text class="kzc-msg" x="240" y="83">복제</text>
  <path class="kzc-pgreen" d="M 115 112 L 115 164 L 287 164" marker-end="url(#kzc-follower-fetching-green)"/>
  <text class="kzc-msg" x="240" y="153">fetch</text>
  <text class="kzc-sub kzc-left" x="16" y="232">follower fetching: 같은 zone replica 에서 읽는다</text>
  <rect class="kzc-group" x="16" y="246" width="200" height="166" rx="12"/>
  <text class="kzc-sub kzc-left" x="28" y="266">zone a</text>
  <rect class="kzc-group" x="264" y="246" width="200" height="166" rx="12"/>
  <text class="kzc-sub kzc-left" x="276" y="266">zone c</text>
  <rect class="kzc-node" x="40" y="282" width="150" height="36" rx="8"/>
  <text class="kzc-t" x="115.0" y="300.0">broker 1 · leader</text>
  <rect class="kzc-node" x="288" y="282" width="150" height="36" rx="8"/>
  <text class="kzc-t" x="363.0" y="300.0">broker 3 · follower</text>
  <rect class="kzc-green" x="288" y="342" width="150" height="56" rx="8"/>
  <text class="kzc-t" x="363.0" y="361.0">consumer</text>
  <text class="kzc-t" x="363.0" y="379.0">client.rack=c</text>
  <path class="kzc-pamber" d="M 190 300 L 287 300" marker-end="url(#kzc-follower-fetching-amber)"/>
  <text class="kzc-msg" x="240" y="289">복제</text>
  <path class="kzc-pgreen" d="M 363 318 L 363 341" marker-end="url(#kzc-follower-fetching-green)"/>
  <text class="kzc-msg" x="404" y="330">fetch</text>
</svg>
