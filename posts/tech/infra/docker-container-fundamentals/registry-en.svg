<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 680.3 134.3" width="100%" style="display: block; max-width: 680.3px; margin: 0 auto" role="img" aria-labelledby="registry-title">
  <title id="registry-title">Registry</title>
  <defs>
    <marker id="registry-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="registry-arrow-start" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
