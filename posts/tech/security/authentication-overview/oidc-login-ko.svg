<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 444" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="authn-oidc-login-title">
  <title id="authn-oidc-login-title">OIDC 로그인 — 인가 코드를 토큰으로 교환하고, ID Token 을 검증해 사용자 신원을 확정한다</title>
  <style>
    .authn-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .authn-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .authn-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .authn-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .authn-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .authn-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .authn-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .authn-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .authn-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .authn-dash { stroke-dasharray: 5 4; }
    .authn-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .authn-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="authn-oidc-login-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="authn-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="authn-life" x1="100" y1="76" x2="100" y2="424"/>
  <line class="authn-life" x1="280" y1="76" x2="280" y2="424"/>
  <line class="authn-life" x1="460" y1="76" x2="460" y2="424"/>
  <rect class="authn-blue" x="25" y="20" width="150" height="56" rx="8"/>
  <text class="authn-t" x="100" y="48">사용자</text>
  <rect class="authn-green" x="205" y="20" width="150" height="56" rx="8"/>
  <text class="authn-t" x="280" y="48">애플리케이션</text>
  <rect class="authn-green" x="385" y="20" width="150" height="56" rx="8"/>
  <text class="authn-t" x="460" y="39">신원 공급자</text>
  <text class="authn-t" x="460" y="57">(예: Google)</text>
  <text class="authn-msg" x="190" y="93">'Google로 로그인' 클릭</text>
  <circle class="authn-group" cx="100" cy="104" r="9"/>
  <text class="authn-msg" x="100" y="104">1</text>
  <line class="authn-line" x1="109" y1="104" x2="279" y2="104" marker-end="url(#authn-oidc-login-arrow)"/>
  <text class="authn-msg" x="370" y="133">인증 요청</text>
  <text class="authn-msg" x="370" y="151">(동의 화면으로 이동)</text>
  <circle class="authn-group" cx="280" cy="162" r="9"/>
  <text class="authn-msg" x="280" y="162">2</text>
  <line class="authn-line" x1="289" y1="162" x2="459" y2="162" marker-end="url(#authn-oidc-login-arrow)"/>
  <text class="authn-msg" x="190" y="191">자격 증명 입력</text>
  <text class="authn-msg" x="190" y="209">및 권한 동의</text>
  <circle class="authn-group" cx="100" cy="220" r="9"/>
  <text class="authn-msg" x="100" y="220">3</text>
  <line class="authn-line" x1="109" y1="220" x2="459" y2="220" marker-end="url(#authn-oidc-login-arrow)"/>
  <text class="authn-msg" x="370" y="249">인가 코드 발급</text>
  <circle class="authn-group" cx="460" cy="260" r="9"/>
  <text class="authn-msg" x="460" y="260">4</text>
  <line class="authn-line authn-dash" x1="451" y1="260" x2="281" y2="260" marker-end="url(#authn-oidc-login-arrow)"/>
  <text class="authn-msg" x="370" y="289">인가 코드 ↔ 토큰 교환</text>
  <circle class="authn-group" cx="280" cy="300" r="9"/>
  <text class="authn-msg" x="280" y="300">5</text>
  <line class="authn-line" x1="289" y1="300" x2="459" y2="300" marker-end="url(#authn-oidc-login-arrow)"/>
  <text class="authn-msg" x="370" y="329">access token (인가) +</text>
  <text class="authn-msg" x="370" y="347">ID Token (인증, JWT)</text>
  <circle class="authn-group" cx="460" cy="358" r="9"/>
  <text class="authn-msg" x="460" y="358">6</text>
  <line class="authn-line authn-dash" x1="451" y1="358" x2="281" y2="358" marker-end="url(#authn-oidc-login-arrow)"/>
  <rect class="authn-group" x="150" y="374" width="260" height="30" rx="6"/>
  <text class="authn-msg" x="280" y="389">ID Token 을 검증해 사용자 신원 확정</text>
</svg>
