<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 677.7 280.6" width="100%" style="display: block; max-width: 677.7px; margin: 0 auto" role="img" aria-labelledby="key-rotation-title">
  <title id="key-rotation-title">Key Rotation</title>
  <defs>
    <marker id="key-rotation-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="key-rotation-arrow-start" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
