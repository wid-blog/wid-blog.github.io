<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 382" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="enve-dek-issue-title">
  <title id="enve-dek-issue-title">DEK 발급과 암호화 — 키 관리 서비스에서 평문·암호화된 DEK 를 받아 데이터를 암호화하고, 암호화된 DEK 를 암호문과 함께 저장한다</title>
  <style>
    .enve-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .enve-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .enve-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .enve-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .enve-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .enve-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .enve-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .enve-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .enve-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .enve-dash { stroke-dasharray: 5 4; }
    .enve-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .enve-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="enve-dek-issue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="enve-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="enve-life" x1="100" y1="56" x2="100" y2="362"/>
  <line class="enve-life" x1="280" y1="56" x2="280" y2="362"/>
  <line class="enve-life" x1="460" y1="56" x2="460" y2="362"/>
  <rect class="enve-blue" x="20" y="20" width="160" height="36" rx="8"/>
  <text class="enve-t" x="100" y="38">서비스</text>
  <rect class="enve-green" x="200" y="20" width="160" height="36" rx="8"/>
  <text class="enve-t" x="280" y="38">키 관리 서비스</text>
  <rect class="enve-green" x="380" y="20" width="160" height="36" rx="8"/>
  <text class="enve-t" x="460" y="38">DB</text>
  <text class="enve-msg" x="190" y="73">새 DEK 발급 요청</text>
  <text class="enve-msg" x="190" y="91">(CMK 지정)</text>
  <line class="enve-line" x1="100" y1="102" x2="279" y2="102" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="131">평문 DEK + 암호화된 DEK</text>
  <text class="enve-msg" x="190" y="149">반환</text>
  <line class="enve-line enve-dash" x1="280" y1="160" x2="101" y2="160" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="189">평문 DEK + IV로</text>
  <text class="enve-msg" x="190" y="207">데이터 암호화</text>
  <path class="enve-line" d="M100,218 H130 V238 H101" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="267">암호문 + IV +</text>
  <text class="enve-msg" x="190" y="285">암호화된 DEK 저장</text>
  <line class="enve-line" x1="100" y1="296" x2="459" y2="296" marker-end="url(#enve-dek-issue-arrow)"/>
  <rect class="enve-group" x="20" y="312" width="160" height="30" rx="6"/>
  <text class="enve-msg" x="100" y="327">평문 DEK 즉시 폐기</text>
</svg>
