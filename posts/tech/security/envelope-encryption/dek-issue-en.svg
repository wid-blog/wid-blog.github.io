<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 402" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="enve-dek-issue-title">
  <title id="enve-dek-issue-title">DEK issuance and encryption — get a plaintext and an encrypted DEK from the key management service, encrypt the data, and store the encrypted DEK with the ciphertext</title>
  <style>
    .enve-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .enve-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .enve-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .enve-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .enve-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .enve-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .enve-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .enve-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .enve-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .enve-dash { stroke-dasharray: 5 4; }
    .enve-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .enve-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="enve-dek-issue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="enve-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="enve-life" x1="100" y1="76" x2="100" y2="382"/>
  <line class="enve-life" x1="280" y1="76" x2="280" y2="382"/>
  <line class="enve-life" x1="460" y1="76" x2="460" y2="382"/>
  <rect class="enve-blue" x="20" y="20" width="160" height="56" rx="8"/>
  <text class="enve-t" x="100" y="48">Service</text>
  <rect class="enve-green" x="200" y="20" width="160" height="56" rx="8"/>
  <text class="enve-t" x="280" y="39">Key Management</text>
  <text class="enve-t" x="280" y="57">Service</text>
  <rect class="enve-green" x="380" y="20" width="160" height="56" rx="8"/>
  <text class="enve-t" x="460" y="48">DB</text>
  <text class="enve-msg" x="190" y="93">Request new DEK</text>
  <text class="enve-msg" x="190" y="111">(specify CMK)</text>
  <line class="enve-line" x1="100" y1="122" x2="279" y2="122" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="151">Return plaintext DEK</text>
  <text class="enve-msg" x="190" y="169">+ encrypted DEK</text>
  <line class="enve-line enve-dash" x1="280" y1="180" x2="101" y2="180" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="209">Encrypt data with</text>
  <text class="enve-msg" x="190" y="227">plaintext DEK + IV</text>
  <path class="enve-line" d="M100,238 H130 V258 H101" marker-end="url(#enve-dek-issue-arrow)"/>
  <text class="enve-msg" x="190" y="287">Store ciphertext + IV</text>
  <text class="enve-msg" x="190" y="305">+ encrypted DEK</text>
  <line class="enve-line" x1="100" y1="316" x2="459" y2="316" marker-end="url(#enve-dek-issue-arrow)"/>
  <rect class="enve-group" x="20" y="332" width="270" height="30" rx="6"/>
  <text class="enve-msg" x="155" y="347">Discard plaintext DEK immediately</text>
</svg>
