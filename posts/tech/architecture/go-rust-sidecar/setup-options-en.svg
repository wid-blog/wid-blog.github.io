<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 570.2 234.3" width="100%" style="display: block; max-width: 570.2px; margin: 0 auto" role="img" aria-labelledby="setup-options-title">
  <title id="setup-options-title">Setup Options</title>
  <defs>
    <marker id="setup-options-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
