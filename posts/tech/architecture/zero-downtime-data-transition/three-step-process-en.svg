<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 796.4 97.2" width="100%" style="display: block; max-width: 796.4px; margin: 0 auto" role="img" aria-labelledby="three-step-process-title">
  <title id="three-step-process-title">Three-Step Process</title>
  <defs>
    <marker id="three-step-process-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="three-step-process-arrow-start" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,5 L10,10 L10,0 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-group-text { fill: var(--secondary); font: 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-label-bg { fill: var(--entry); }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-dot { stroke-dasharray: 4 3; }
    .d-thick { stroke-width: 3; }
    .d-accent { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-accent-strong { fill: rgba(70, 130, 220, 0.34); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-ok { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-ok-strong { fill: rgba(60, 160, 90, 0.34); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-warm { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-warm-strong { fill: rgba(220, 130, 40, 0.34); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-bad { fill: rgba(210, 70, 70, 0.14); stroke: rgb(210, 70, 70); stroke-width: 1.5; }
    .d-bad-strong { fill: rgba(210, 70, 70, 0.34); stroke: rgb(210, 70, 70); stroke-width: 1.5; }
    .d-violet { fill: rgba(150, 90, 200, 0.14); stroke: rgb(150, 90, 200); stroke-width: 1.5; }
    .d-violet-strong { fill: rgba(150, 90, 200, 0.34); stroke: rgb(150, 90, 200); stroke-width: 1.5; }
    .d-yellow { fill: rgba(200, 170, 30, 0.14); stroke: rgb(200, 170, 30); stroke-width: 1.5; }
    .d-yellow-strong { fill: rgba(200, 170, 30, 0.34); stroke: rgb(200, 170, 30); stroke-width: 1.5; }
    .d-mute { fill: rgba(128, 128, 128, 0.14); stroke: rgb(128, 128, 128); stroke-width: 1.5; }
    .d-mute-strong { fill: rgba(128, 128, 128, 0.34); stroke: rgb(128, 128, 128); stroke-width: 1.5; }
  </style>

  <path class="d-line" transform="translate(0,0)" d="M200.156,38.608L209.605,38.608C219.055,38.608,237.953,38.608,255.968,38.608C273.983,38.608,291.115,38.608,299.681,38.608L308.247,38.608" marker-end="url(#three-step-process-arrow)"/>
  <path class="d-line" transform="translate(0,0)" d="M497.844,38.608L506.181,38.608C514.518,38.608,531.193,38.608,546.984,38.608C562.775,38.608,577.683,38.608,585.137,38.608L592.591,38.608" marker-end="url(#three-step-process-arrow)"/>
  <rect class="d-label-bg" x="223.2" y="29" width="67.4" height="19.2" rx="3"/>
  <text class="d-text" x="256.8" y="39.6">Deployed</text>
  <rect class="d-label-bg" x="520.8" y="29.1" width="54" height="19" rx="3"/>
  <text class="d-text" x="547.9" y="39.6">Verified</text>
  <rect class="d-box" transform="translate(100.1,38.6)" x="-100.078125" y="-38.607666015625" width="200.15625" height="77.21533203125" rx="4" ry="4"/>
  <text class="d-text" x="100.1" y="17.1">&lt;b&gt;Step 1: Preparation&lt;/b&gt;</text>
  <text class="d-text" x="100.1" y="32">Add new format</text>
  <text class="d-text" x="100.1" y="47">Start dual write</text>
  <text class="d-text" x="100.1" y="62.1">Apply fallback read</text>
  <rect class="d-box" transform="translate(405.7,38.6)" x="-92.1484375" y="-38.607666015625" width="184.296875" height="77.21533203125" rx="4" ry="4"/>
  <text class="d-text" x="405.7" y="17.2">&lt;b&gt;Step 2: Migration&lt;/b&gt;</text>
  <text class="d-text" x="405.7" y="32.2">Convert existing data</text>
  <text class="d-text" x="405.7" y="47">to new format</text>
  <text class="d-text" x="405.7" y="62.1">dry-run → execute</text>
  <rect class="d-box" transform="translate(687.1,38.6)" x="-89.2421875" y="-31.063720703125" width="178.484375" height="62.12744140625" rx="4" ry="4"/>
  <text class="d-text" x="687.1" y="24.6">&lt;b&gt;Step 3: Cleanup&lt;/b&gt;</text>
  <text class="d-text" x="687.1" y="39.5">Remove fallback</text>
  <text class="d-text" x="687.1" y="54.6">Drop old format</text>
</svg>
