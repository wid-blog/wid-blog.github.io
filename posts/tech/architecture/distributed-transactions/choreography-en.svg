<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 358" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="dtx-choreography-title">
  <title id="dtx-choreography-title">Choreography saga — services chain events, and on failure compensation events flow in reverse</title>
  <style>
    .dtx-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .dtx-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .dtx-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .dtx-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .dtx-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .dtx-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .dtx-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .dtx-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .dtx-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .dtx-dash { stroke-dasharray: 5 4; }
    .dtx-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .dtx-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="dtx-choreography-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="dtx-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="dtx-life" x1="80" y1="56" x2="80" y2="338"/>
  <line class="dtx-life" x1="213" y1="56" x2="213" y2="338"/>
  <line class="dtx-life" x1="347" y1="56" x2="347" y2="338"/>
  <line class="dtx-life" x1="480" y1="56" x2="480" y2="338"/>
  <rect class="dtx-blue" x="22" y="20" width="116" height="36" rx="8"/>
  <text class="dtx-t" x="80" y="38">Order</text>
  <rect class="dtx-green" x="155" y="20" width="116" height="36" rx="8"/>
  <text class="dtx-t" x="213" y="38">Payment</text>
  <rect class="dtx-green" x="289" y="20" width="116" height="36" rx="8"/>
  <text class="dtx-t" x="347" y="38">Inventory</text>
  <rect class="dtx-green" x="422" y="20" width="116" height="36" rx="8"/>
  <text class="dtx-t" x="480" y="38">Shipment</text>
  <text class="dtx-msg" x="146.5" y="73">OrderCreated</text>
  <line class="dtx-line" x1="80" y1="84" x2="212" y2="84" marker-end="url(#dtx-choreography-arrow)"/>
  <text class="dtx-msg" x="280" y="113">PaymentCompleted</text>
  <line class="dtx-line" x1="213" y1="124" x2="346" y2="124" marker-end="url(#dtx-choreography-arrow)"/>
  <text class="dtx-msg" x="413.5" y="153">InventoryReserved</text>
  <line class="dtx-line" x1="347" y1="164" x2="479" y2="164" marker-end="url(#dtx-choreography-arrow)"/>
  <rect class="dtx-group" x="22" y="180" width="516" height="30" rx="6"/>
  <text class="dtx-msg" x="280" y="195">On failure — compensation events in reverse</text>
  <text class="dtx-msg" x="413.5" y="227">ShipmentFailed</text>
  <line class="dtx-line dtx-dash" x1="480" y1="238" x2="348" y2="238" marker-end="url(#dtx-choreography-arrow)"/>
  <text class="dtx-msg" x="280" y="267">InventoryReleased</text>
  <line class="dtx-line dtx-dash" x1="347" y1="278" x2="214" y2="278" marker-end="url(#dtx-choreography-arrow)"/>
  <text class="dtx-msg" x="146.5" y="307">PaymentRefunded</text>
  <line class="dtx-line dtx-dash" x1="213" y1="318" x2="81" y2="318" marker-end="url(#dtx-choreography-arrow)"/>
</svg>
