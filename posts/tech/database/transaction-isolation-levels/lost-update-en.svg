<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="tiso-lost-update-title">
  <title id="tiso-lost-update-title">Lost update — both transactions read stock 100 and each write 99, so two sales leave stock at 99</title>
  <style>
    .tiso-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tiso-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tiso-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tiso-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tiso-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tiso-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tiso-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tiso-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tiso-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tiso-dash { stroke-dasharray: 5 4; }
    .tiso-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tiso-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="tiso-lost-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tiso-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="tiso-life" x1="100" y1="56" x2="100" y2="306"/>
  <line class="tiso-life" x1="280" y1="56" x2="280" y2="306"/>
  <line class="tiso-life" x1="460" y1="56" x2="460" y2="306"/>
  <rect class="tiso-blue" x="40" y="20" width="120" height="36" rx="8"/>
  <text class="tiso-t" x="100" y="38">T1</text>
  <rect class="tiso-green" x="220" y="20" width="120" height="36" rx="8"/>
  <text class="tiso-t" x="280" y="38">DB</text>
  <rect class="tiso-blue" x="400" y="20" width="120" height="36" rx="8"/>
  <text class="tiso-t" x="460" y="38">T2</text>
  <text class="tiso-msg" x="190" y="73">SELECT stock → 100</text>
  <line class="tiso-line" x1="100" y1="84" x2="279" y2="84" marker-end="url(#tiso-lost-update-arrow)"/>
  <text class="tiso-msg" x="370" y="113">SELECT stock → 100</text>
  <line class="tiso-line" x1="460" y1="124" x2="281" y2="124" marker-end="url(#tiso-lost-update-arrow)"/>
  <text class="tiso-msg" x="190" y="153">UPDATE stock</text>
  <text class="tiso-msg" x="190" y="171">= 100 - 1 = 99</text>
  <line class="tiso-line" x1="100" y1="182" x2="279" y2="182" marker-end="url(#tiso-lost-update-arrow)"/>
  <text class="tiso-msg" x="370" y="211">UPDATE stock</text>
  <text class="tiso-msg" x="370" y="229">= 100 - 1 = 99</text>
  <line class="tiso-line" x1="460" y1="240" x2="281" y2="240" marker-end="url(#tiso-lost-update-arrow)"/>
  <rect class="tiso-group" x="175" y="256" width="210" height="30" rx="6"/>
  <text class="tiso-msg" x="280" y="271">two sold, but stock is 99</text>
</svg>
