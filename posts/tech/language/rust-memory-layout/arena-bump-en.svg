<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 394" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rml-arena-bump-title">
  <title id="rml-arena-bump-title">Box::new allocates and frees once per node; Bump just advances a position in a chunk and clears it all on one reset</title>
  <style>
    .rml-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rml-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rml-monor { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: end; dominant-baseline: central; white-space: pre; }
    .rml-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rml-pad { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 3; }
    .rml-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rml-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rml-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rml-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rml-dash { stroke-dasharray: 5 4; }
    .rml-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rml-arena-bump-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rml-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rml-group" x="20" y="20" width="440" height="136" rx="12"/>
  <text class="rml-sub" x="32" y="40">Box::new × 1000 — 1000 allocs, 1000 frees</text>
  <rect class="rml-amber" x="32" y="74" width="130" height="36" rx="8"/>
  <text class="rml-t" x="97.0" y="92.0">global allocator</text>
  <rect class="rml-blue" x="232" y="56" width="70" height="28" rx="8"/>
  <text class="rml-monoc" x="267.0" y="70.0">node 0</text>
  <path class="rml-line" d="M162,92 L231,70" marker-end="url(#rml-arena-bump-arrow)"/>
  <rect class="rml-blue" x="330" y="72" width="70" height="28" rx="8"/>
  <text class="rml-monoc" x="365.0" y="86.0">node 1</text>
  <path class="rml-line" d="M162,92 L329,86" marker-end="url(#rml-arena-bump-arrow)"/>
  <rect class="rml-blue" x="252" y="108" width="70" height="28" rx="8"/>
  <text class="rml-monoc" x="287.0" y="122.0">node 2</text>
  <path class="rml-line" d="M162,92 L251,122" marker-end="url(#rml-arena-bump-arrow)"/>
  <rect class="rml-blue" x="366" y="116" width="70" height="28" rx="8"/>
  <text class="rml-monoc" x="401.0" y="130.0">node 3</text>
  <path class="rml-line" d="M162,92 L365,130" marker-end="url(#rml-arena-bump-arrow)"/>
  <rect class="rml-group" x="20" y="172" width="440" height="180" rx="12"/>
  <text class="rml-sub" x="32" y="192">Bump::alloc × 1000 — only a position moves</text>
  <text class="rml-note" x="32" y="216">chunk (allocated up front)</text>
  <rect class="rml-pad" x="32" y="230" width="416" height="40" rx="8"/>
  <rect class="rml-blue" x="36" y="234" width="70" height="32" rx="8"/>
  <text class="rml-monoc" x="71.0" y="250.0">node 0</text>
  <rect class="rml-blue" x="110" y="234" width="70" height="32" rx="8"/>
  <text class="rml-monoc" x="145.0" y="250.0">node 1</text>
  <rect class="rml-blue" x="184" y="234" width="70" height="32" rx="8"/>
  <text class="rml-monoc" x="219.0" y="250.0">node 2</text>
  <rect class="rml-blue" x="258" y="234" width="70" height="32" rx="8"/>
  <text class="rml-monoc" x="293.0" y="250.0">node 3</text>
  <text class="rml-msg" x="382" y="250">…</text>
  <text class="rml-note" x="330" y="304">next slot</text>
  <path class="rml-line" d="M352,292 V271" marker-end="url(#rml-arena-bump-arrow)"/>
  <text class="rml-note" x="32" y="326">one reset() moves the position back and clears it all</text>
  <text class="rml-note" x="20" y="376">no per-value free, and Drop of stored values never runs</text>
</svg>
