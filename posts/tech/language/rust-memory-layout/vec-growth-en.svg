<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 424" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rml-vec-growth-title">
  <title id="rml-vec-growth-title">Pushing 100 items onto Vec::new grows capacity from 4 by doubling, reallocating 6 times; with_capacity(100) never changes</title>
  <style>
    .rml-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rml-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rml-monor { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: end; dominant-baseline: central; white-space: pre; }
    .rml-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rml-pad { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 3; }
    .rml-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rml-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rml-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rml-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rml-dash { stroke-dasharray: 5 4; }
    .rml-head { fill: var(--secondary); }
  </style>
  <rect class="rml-group" x="20" y="20" width="440" height="240" rx="12"/>
  <text class="rml-sub" x="32" y="40">push onto Vec::new() — when capacity changed</text>
  <text class="rml-mono" x="32" y="69">len 1</text>
  <rect class="rml-amber" x="100" y="56" width="8.8" height="26" rx="4"/>
  <text class="rml-mono" x="116.8" y="69">cap 4</text>
  <text class="rml-mono" x="32" y="101">len 5</text>
  <rect class="rml-amber" x="100" y="88" width="17.6" height="26" rx="4"/>
  <text class="rml-mono" x="125.6" y="101">cap 8</text>
  <text class="rml-mono" x="32" y="133">len 9</text>
  <rect class="rml-amber" x="100" y="120" width="35.2" height="26" rx="4"/>
  <text class="rml-mono" x="143.2" y="133">cap 16</text>
  <text class="rml-mono" x="32" y="165">len 17</text>
  <rect class="rml-amber" x="100" y="152" width="70.4" height="26" rx="4"/>
  <text class="rml-mono" x="178.4" y="165">cap 32</text>
  <text class="rml-mono" x="32" y="197">len 33</text>
  <rect class="rml-amber" x="100" y="184" width="140.8" height="26" rx="4"/>
  <text class="rml-mono" x="248.8" y="197">cap 64</text>
  <text class="rml-mono" x="32" y="229">len 65</text>
  <rect class="rml-amber" x="100" y="216" width="281.6" height="26" rx="4"/>
  <text class="rml-mono" x="389.6" y="229">cap 128</text>
  <rect class="rml-group" x="20" y="276" width="440" height="84" rx="12"/>
  <text class="rml-sub" x="32" y="296">push onto Vec::with_capacity(100)</text>
  <rect class="rml-green" x="100" y="312" width="220.00000000000003" height="26" rx="4"/>
  <text class="rml-mono" x="328.0" y="325">cap 100</text>
  <text class="rml-note" x="20" y="384">each change allocates a larger buffer and moves the elements</text>
  <text class="rml-note" x="20" y="406">with_capacity: no change over 100 pushes</text>
</svg>
