<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 462" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rml-bench-results-title">
  <title id="rml-bench-results-title">In every run SmallVec and Bump were faster in line with the allocations they removed; the with_capacity gap was about the size of the noise</title>
  <style>
    .rml-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rml-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rml-monor { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: end; dominant-baseline: central; white-space: pre; }
    .rml-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rml-pad { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 3; }
    .rml-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rml-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rml-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rml-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rml-dash { stroke-dasharray: 5 4; }
    .rml-head { fill: var(--secondary); }
  </style>
  <rect class="rml-group" x="20" y="20" width="440" height="118" rx="12"/>
  <text class="rml-sub" x="32" y="40">push 1000 u64</text>
  <text class="rml-mono" x="32" y="69">Vec::new</text>
  <rect class="rml-amber" x="190" y="56" width="98.34465097067327" height="26" rx="4"/>
  <path class="rml-line" d="M265.7,69 H312.2 M265.7,63 V75 M312.2,63 V75"/>
  <text class="rml-mono" x="318.2227178851714" y="69">3.8 µs</text>
  <text class="rml-mono" x="32" y="105">Vec::with_capacity</text>
  <rect class="rml-green" x="190" y="92" width="130.7864518793887" height="26" rx="4"/>
  <path class="rml-line" d="M275.9,105 H376.0 M275.9,99 V111 M376.0,99 V111"/>
  <text class="rml-mono" x="382.0" y="105">5.1 µs</text>
  <rect class="rml-group" x="20" y="150" width="440" height="118" rx="12"/>
  <text class="rml-sub" x="32" y="170">1000 groups of 3 elements</text>
  <text class="rml-mono" x="32" y="199">Vec</text>
  <rect class="rml-amber" x="190" y="186" width="157.55332390794212" height="26" rx="4"/>
  <path class="rml-line" d="M320.5,199 H376.0 M320.5,193 V205 M376.0,193 V205"/>
  <text class="rml-mono" x="382.0" y="199">58.1 µs</text>
  <text class="rml-mono" x="32" y="235">SmallVec&lt;[u32; 4]&gt;</text>
  <rect class="rml-green" x="190" y="222" width="10.433068547858152" height="26" rx="4"/>
  <path class="rml-line" d="M198.3,235 H202.9 M198.3,229 V241 M202.9,229 V241"/>
  <text class="rml-mono" x="208.87867480942734" y="235">3.8 µs</text>
  <rect class="rml-group" x="20" y="280" width="440" height="118" rx="12"/>
  <text class="rml-sub" x="32" y="300">1000 nodes</text>
  <text class="rml-mono" x="32" y="329">Box::new each</text>
  <rect class="rml-amber" x="190" y="316" width="153.58512775529837" height="26" rx="4"/>
  <path class="rml-line" d="M316.5,329 H376.0 M316.5,323 V335 M376.0,323 V335"/>
  <text class="rml-mono" x="382.0" y="329">29.2 µs</text>
  <text class="rml-mono" x="32" y="365">Bump + reset</text>
  <rect class="rml-green" x="190" y="352" width="15.632189241956935" height="26" rx="4"/>
  <path class="rml-line" d="M203.2,365 H208.4 M203.2,359 V371 M208.4,359 V371"/>
  <text class="rml-mono" x="214.38474293313715" y="365">3.0 µs</text>
  <text class="rml-note" x="20" y="422">bar = estimate, line = confidence interval, scale per group</text>
  <text class="rml-note" x="20" y="444">Apple M4 Pro, rustc 1.94.1 --release, third run</text>
</svg>
