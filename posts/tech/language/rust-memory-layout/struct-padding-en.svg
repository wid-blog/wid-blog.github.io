<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rml-struct-padding-title">
  <title id="rml-struct-padding-title">repr(C) keeps declaration order and needs 5 padding bytes for 12 bytes; the default layout reorders fields into 8 bytes</title>
  <style>
    .rml-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rml-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rml-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rml-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rml-monor { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: end; dominant-baseline: central; white-space: pre; }
    .rml-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rml-pad { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 3; }
    .rml-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rml-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rml-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rml-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rml-dash { stroke-dasharray: 5 4; }
    .rml-head { fill: var(--secondary); }
  </style>
  <rect class="rml-group" x="20" y="20" width="210" height="192" rx="12"/>
  <text class="rml-sub" x="32" y="40">#[repr(C)] — 12B</text>
  <text class="rml-note" x="28" y="74">0</text>
  <rect class="rml-amber" x="45" y="56" width="40" height="36" rx="8"/>
  <text class="rml-monoc" x="65.0" y="74.0">kind</text>
  <rect class="rml-pad" x="87" y="56" width="124" height="36" rx="8"/>
  <text class="rml-t" x="149.0" y="74.0">pad</text>
  <text class="rml-note" x="28" y="118">4</text>
  <rect class="rml-blue" x="45" y="100" width="166" height="36" rx="8"/>
  <text class="rml-monoc" x="128.0" y="118.0">id</text>
  <text class="rml-note" x="28" y="162">8</text>
  <rect class="rml-green" x="45" y="144" width="82" height="36" rx="8"/>
  <text class="rml-monoc" x="86.0" y="162.0">flags</text>
  <rect class="rml-pad" x="129" y="144" width="82" height="36" rx="8"/>
  <text class="rml-t" x="170.0" y="162.0">pad</text>
  <rect class="rml-group" x="250" y="20" width="210" height="192" rx="12"/>
  <text class="rml-sub" x="262" y="40">default layout — 8B</text>
  <text class="rml-note" x="258" y="74">0</text>
  <rect class="rml-blue" x="275" y="56" width="166" height="36" rx="8"/>
  <text class="rml-monoc" x="358.0" y="74.0">id</text>
  <text class="rml-note" x="258" y="118">4</text>
  <rect class="rml-green" x="275" y="100" width="82" height="36" rx="8"/>
  <text class="rml-monoc" x="316.0" y="118.0">flags</text>
  <rect class="rml-amber" x="359" y="100" width="40" height="36" rx="8"/>
  <text class="rml-monoc" x="379.0" y="118.0">kind</text>
  <rect class="rml-pad" x="401" y="100" width="40" height="36" rx="8"/>
  <text class="rml-t" x="421.0" y="118.0">pad</text>
  <text class="rml-note" x="20" y="236">one row = 4-byte alignment unit</text>
  <text class="rml-note" x="20" y="258">[EventC; 4] = 48B, [Event; 4] = 32B</text>
</svg>
