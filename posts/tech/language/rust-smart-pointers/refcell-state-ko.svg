<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rsp-refcell-state-title">
  <title id="rsp-refcell-state-title">RefCell 은 공유 대여 여럿 또는 가변 대여 하나만 허용하고, 겹치면 런타임에 panic 한다</title>
  <style>
    .rsp-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rsp-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rsp-cell { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rsp-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rsp-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rsp-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rsp-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rsp-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rsp-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rsp-dash { stroke-dasharray: 5 4; }
    .rsp-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rsp-refcell-state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rsp-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <text class="rsp-sub" x="20" y="20">대여 상태</text>
  <text class="rsp-sub" x="186" y="20">호출</text>
  <text class="rsp-sub" x="300" y="20">결과</text>
  <rect class="rsp-blue" x="20" y="40" width="130" height="36" rx="8"/>
  <text class="rsp-t" x="85" y="58">대여 없음</text>
  <text class="rsp-monoc" x="225" y="47">borrow()</text>
  <line class="rsp-line" x1="150" y1="58" x2="299" y2="58" marker-end="url(#rsp-refcell-state-arrow)"/>
  <rect class="rsp-green" x="300" y="40" width="160" height="36" rx="8"/>
  <text class="rsp-t" x="380" y="58">공유 대여 1</text>
  <rect class="rsp-blue" x="20" y="88" width="130" height="36" rx="8"/>
  <text class="rsp-t" x="85" y="106">공유 대여 n</text>
  <text class="rsp-monoc" x="225" y="95">borrow()</text>
  <line class="rsp-line" x1="150" y1="106" x2="299" y2="106" marker-end="url(#rsp-refcell-state-arrow)"/>
  <rect class="rsp-green" x="300" y="88" width="160" height="36" rx="8"/>
  <text class="rsp-t" x="380" y="106">공유 대여 n+1</text>
  <rect class="rsp-blue" x="20" y="136" width="130" height="36" rx="8"/>
  <text class="rsp-t" x="85" y="154">대여 없음</text>
  <text class="rsp-monoc" x="225" y="143">borrow_mut()</text>
  <line class="rsp-line" x1="150" y1="154" x2="299" y2="154" marker-end="url(#rsp-refcell-state-arrow)"/>
  <rect class="rsp-green" x="300" y="136" width="160" height="36" rx="8"/>
  <text class="rsp-t" x="380" y="154">가변 대여 1</text>
  <rect class="rsp-blue" x="20" y="184" width="130" height="36" rx="8"/>
  <text class="rsp-t" x="85" y="202">공유 대여 n</text>
  <text class="rsp-monoc" x="225" y="191">borrow_mut()</text>
  <line class="rsp-line" x1="150" y1="202" x2="299" y2="202" marker-end="url(#rsp-refcell-state-arrow)"/>
  <rect class="rsp-amber" x="300" y="184" width="160" height="36" rx="8"/>
  <text class="rsp-t" x="380" y="202">panic</text>
  <rect class="rsp-blue" x="20" y="232" width="130" height="36" rx="8"/>
  <text class="rsp-t" x="85" y="250">가변 대여 1</text>
  <text class="rsp-monoc" x="225" y="239">borrow()</text>
  <line class="rsp-line" x1="150" y1="250" x2="299" y2="250" marker-end="url(#rsp-refcell-state-arrow)"/>
  <rect class="rsp-amber" x="300" y="232" width="160" height="36" rx="8"/>
  <text class="rsp-t" x="380" y="250">panic</text>
  <text class="rsp-note" x="20" y="296">Ref·RefMut 가 drop 되면 대여가 풀린다</text>
  <text class="rsp-note" x="20" y="318">try_borrow_mut() 는 panic 대신 Err 를 돌려준다</text>
</svg>
