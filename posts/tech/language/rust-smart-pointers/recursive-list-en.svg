<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 308" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rsp-recursive-list-title">
  <title id="rsp-recursive-list-title">A recursive enum without Box has infinite size; with Box each node is 16 bytes</title>
  <style>
    .rsp-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rsp-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rsp-cell { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rsp-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rsp-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rsp-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rsp-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rsp-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rsp-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rsp-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rsp-dash { stroke-dasharray: 5 4; }
    .rsp-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rsp-recursive-list-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rsp-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <text class="rsp-sub" x="20" y="20">Without Box — the size never stops adding up</text>
  <rect class="rsp-amber" x="20" y="36" width="440" height="100" rx="8"/>
  <text class="rsp-monoc" x="56" y="86">i32</text>
  <rect class="rsp-amber" x="92" y="48" width="356" height="76" rx="8"/>
  <text class="rsp-monoc" x="128" y="86">i32</text>
  <rect class="rsp-amber" x="164" y="60" width="272" height="52" rx="8"/>
  <text class="rsp-monoc" x="200" y="86">i32</text>
  <rect class="rsp-amber" x="236" y="72" width="188" height="28" rx="6"/>
  <text class="rsp-msg" x="330" y="86">…</text>
  <text class="rsp-mono" x="20" y="156">E0072: recursive type `List` has infinite size</text>
  <text class="rsp-sub" x="20" y="192">With Box — each Cons is 16 bytes</text>
  <rect class="rsp-blue" x="20" y="208" width="130" height="36" rx="8"/>
  <text class="rsp-monoc" x="85" y="226">Cons(1, Box)</text>
  <rect class="rsp-green" x="175" y="208" width="130" height="36" rx="8"/>
  <text class="rsp-monoc" x="240" y="226">Cons(2, Box)</text>
  <rect class="rsp-green" x="330" y="208" width="130" height="36" rx="8"/>
  <text class="rsp-monoc" x="395" y="226">Nil</text>
  <line class="rsp-line" x1="150" y1="226" x2="174" y2="226" marker-end="url(#rsp-recursive-list-arrow)"/>
  <line class="rsp-line" x1="305" y1="226" x2="329" y2="226" marker-end="url(#rsp-recursive-list-arrow)"/>
  <text class="rsp-msg" x="85" y="260">stack</text>
  <text class="rsp-msg" x="240" y="260">heap</text>
  <text class="rsp-msg" x="395" y="260">heap</text>
  <text class="rsp-note" x="20" y="288">A pointer has a fixed size, so List becomes finite</text>
</svg>
