<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rci-lazy-chain-title">
  <title id="rci-lazy-chain-title">Each time collect calls next, one element passes through map, filter, and take; once take is full, 3 and 4 are never pulled</title>
  <style>
    .rci-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rci-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rci-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rci-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rci-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rci-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rci-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rci-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rci-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rci-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rci-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rci-dash { stroke-dasharray: 5 4; }
    .rci-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rci-lazy-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rci-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rci-group" x="20" y="20" width="80" height="36" rx="8"/>
  <text class="rci-monoc" x="60" y="38">iter</text>
  <rect class="rci-group" x="110" y="20" width="80" height="36" rx="8"/>
  <text class="rci-monoc" x="150" y="38">map</text>
  <rect class="rci-group" x="200" y="20" width="80" height="36" rx="8"/>
  <text class="rci-monoc" x="240" y="38">filter</text>
  <rect class="rci-group" x="290" y="20" width="80" height="36" rx="8"/>
  <text class="rci-monoc" x="330" y="38">take(1)</text>
  <rect class="rci-group" x="380" y="20" width="80" height="36" rx="8"/>
  <text class="rci-monoc" x="420" y="38">collect</text>
  <line class="rci-line" x1="420" y1="74" x2="61" y2="74" marker-end="url(#rci-lazy-chain-arrow)"/>
  <text class="rci-msg" x="240" y="92">collect calls next() on take → filter → map → iter</text>
  <rect class="rci-blue" x="20" y="112" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="60" y="127">1</text>
  <rect class="rci-blue" x="110" y="112" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="150" y="127">10</text>
  <rect class="rci-amber" x="200" y="112" width="80" height="30" rx="6"/>
  <text class="rci-msg" x="240" y="127">✗ dropped</text>
  <rect class="rci-blue" x="20" y="152" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="60" y="167">2</text>
  <rect class="rci-blue" x="110" y="152" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="150" y="167">20</text>
  <rect class="rci-green" x="200" y="152" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="240" y="167">✓ 20</text>
  <rect class="rci-green" x="290" y="152" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="330" y="167">20</text>
  <rect class="rci-green" x="380" y="152" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="420" y="167">[20]</text>
  <rect class="rci-group" x="20" y="192" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="60" y="207">3</text>
  <rect class="rci-group" x="110" y="192" width="350" height="30" rx="6"/>
  <text class="rci-msg" x="285" y="207">next() never called</text>
  <rect class="rci-group" x="20" y="232" width="80" height="30" rx="6"/>
  <text class="rci-monoc" x="60" y="247">4</text>
  <rect class="rci-group" x="110" y="232" width="350" height="30" rx="6"/>
  <text class="rci-msg" x="285" y="247">next() never called</text>
  <text class="rci-note" x="20" y="290">One element goes through the whole chain before the next is pulled</text>
</svg>
