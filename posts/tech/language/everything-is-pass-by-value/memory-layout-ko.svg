<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 394" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="pbv-memory-layout-title">
  <title id="pbv-memory-layout-title">세 언어의 메모리 — Java 는 스택의 reference 가 힙 객체를, Python 은 이름이 힙 객체를 가리키고, Go 는 escape analysis 가 위치를 정한다</title>
  <style>
    .pbv-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .pbv-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .pbv-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .pbv-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .pbv-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .pbv-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .pbv-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .pbv-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .pbv-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .pbv-dash { stroke-dasharray: 5 4; }
    .pbv-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .pbv-head { fill: var(--secondary); }
  </style>
  <rect class="pbv-blue" x="20" y="20" width="100" height="110" rx="8"/>
  <text class="pbv-t" x="70" y="75">Java</text>
  <rect class="pbv-group" x="130" y="20" width="330" height="110" rx="8"/>
  <text class="pbv-t" x="295" y="39">Stack:</text>
  <text class="pbv-t" x="295" y="57">s = 0xA1</text>
  <text class="pbv-t" x="295" y="93">Heap:</text>
  <text class="pbv-t" x="295" y="111">0xA1 → StringBuilder</text>
  <rect class="pbv-blue" x="20" y="142" width="100" height="110" rx="8"/>
  <text class="pbv-t" x="70" y="197">Python</text>
  <rect class="pbv-group" x="130" y="142" width="330" height="110" rx="8"/>
  <text class="pbv-t" x="295" y="161">Names:</text>
  <text class="pbv-t" x="295" y="179">a, b → 0xB2</text>
  <text class="pbv-t" x="295" y="215">Heap:</text>
  <text class="pbv-t" x="295" y="233">0xB2 → list</text>
  <rect class="pbv-blue" x="20" y="264" width="100" height="110" rx="8"/>
  <text class="pbv-t" x="70" y="319">Go</text>
  <rect class="pbv-group" x="130" y="264" width="330" height="110" rx="8"/>
  <text class="pbv-t" x="295" y="283">Stack 또는 Heap:</text>
  <text class="pbv-t" x="295" y="301">q Point{1,2}</text>
  <text class="pbv-t" x="295" y="319">p *Point = 0xC3</text>
  <text class="pbv-t" x="295" y="355">(escape analysis 결정)</text>
</svg>
