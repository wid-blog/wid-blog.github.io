<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 298" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="gcm-channel-sync-title">
  <title id="gcm-channel-sync-title">Unbuffered channel — the sender blocks until the receiver takes the value, then both proceed</title>
  <style>
    .gcm-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .gcm-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .gcm-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .gcm-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .gcm-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .gcm-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .gcm-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .gcm-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .gcm-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .gcm-dash { stroke-dasharray: 5 4; }
    .gcm-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .gcm-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="gcm-channel-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="gcm-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="gcm-life" x1="100" y1="76" x2="100" y2="278"/>
  <line class="gcm-life" x1="280" y1="76" x2="280" y2="278"/>
  <line class="gcm-life" x1="460" y1="76" x2="460" y2="278"/>
  <rect class="gcm-blue" x="40" y="20" width="120" height="56" rx="8"/>
  <text class="gcm-t" x="100" y="48">Goroutine 1</text>
  <rect class="gcm-green" x="220" y="20" width="120" height="56" rx="8"/>
  <text class="gcm-t" x="280" y="39">Channel</text>
  <text class="gcm-t" x="280" y="57">(unbuffered)</text>
  <rect class="gcm-blue" x="400" y="20" width="120" height="56" rx="8"/>
  <text class="gcm-t" x="460" y="48">Goroutine 2</text>
  <text class="gcm-msg" x="190" y="93">Send (blocks)</text>
  <line class="gcm-line" x1="100" y1="104" x2="279" y2="104" marker-end="url(#gcm-channel-sync-arrow)"/>
  <rect class="gcm-group" x="30" y="120" width="320" height="30" rx="6"/>
  <text class="gcm-msg" x="190" y="135">Waits until G2 receives</text>
  <text class="gcm-msg" x="370" y="167">Receive</text>
  <line class="gcm-line" x1="460" y1="178" x2="281" y2="178" marker-end="url(#gcm-channel-sync-arrow)"/>
  <text class="gcm-msg" x="190" y="207">Send completes</text>
  <line class="gcm-line gcm-dash" x1="280" y1="218" x2="101" y2="218" marker-end="url(#gcm-channel-sync-arrow)"/>
  <text class="gcm-msg" x="370" y="247">Value delivered</text>
  <line class="gcm-line gcm-dash" x1="280" y1="258" x2="459" y2="258" marker-end="url(#gcm-channel-sync-arrow)"/>
</svg>
