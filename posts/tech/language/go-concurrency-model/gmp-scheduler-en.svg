<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 700.6 403.3" width="100%" style="display: block; max-width: 700.6px; margin: 0 auto" role="img" aria-labelledby="gmp-scheduler-title">
  <title id="gmp-scheduler-title">GMP Scheduler</title>
  <defs>
