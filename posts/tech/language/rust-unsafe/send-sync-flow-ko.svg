<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rus-send-sync-flow-title">
  <title id="rus-send-sync-flow-title">필드가 모두 Send 면 자동으로 Send 이고, 아니면 작성자가 판단해 unsafe impl 한다</title>
  <style>
    .rus-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-tl { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rus-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rus-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rus-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rus-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rus-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rus-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rus-dash { stroke-dasharray: 5 4; }
    .rus-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rus-send-sync-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rus-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rus-blue" x="30" y="20" width="240" height="36" rx="8"/>
  <text class="rus-t" x="150.0" y="38.0">RawBuf 의 필드: *mut u64, usize</text>
  <line class="rus-line" x1="150" y1="56" x2="150" y2="83" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-group" x="60" y="84" width="180" height="36" rx="8"/>
  <text class="rus-t" x="150.0" y="102.0">모든 필드가 Send?</text>
  <text class="rus-msg" x="300" y="91">예</text>
  <line class="rus-line" x1="240" y1="102" x2="329" y2="102" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-green" x="330" y="84" width="134" height="36" rx="8"/>
  <text class="rus-t" x="397.0" y="102.0">자동으로 Send</text>
  <text class="rus-note" x="160" y="138">아니오</text>
  <line class="rus-line" x1="150" y1="120" x2="150" y2="155" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-amber" x="30" y="156" width="240" height="56" rx="8"/>
  <text class="rus-t" x="150.0" y="175.0">*mut u64 는 Send 아님</text>
  <text class="rus-t" x="150.0" y="193.0">thread::spawn 에서 E0277</text>
  <line class="rus-line" x1="150" y1="212" x2="150" y2="239" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-group" x="30" y="240" width="240" height="56" rx="8"/>
  <text class="rus-t" x="150.0" y="259.0">다른 스레드로 옮겨도 안전한가</text>
  <text class="rus-t" x="150.0" y="277.0">작성자가 판단</text>
  <text class="rus-msg" x="300" y="256">아니오</text>
  <line class="rus-line" x1="270" y1="267" x2="329" y2="267" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-group" x="330" y="240" width="134" height="56" rx="8"/>
  <text class="rus-t" x="397.0" y="259.0">Send 구현 안 함</text>
  <text class="rus-t" x="397.0" y="277.0">한 스레드에서만</text>
  <text class="rus-note" x="160" y="308">예</text>
  <line class="rus-line" x1="150" y1="294" x2="150" y2="321" marker-end="url(#rus-send-sync-flow-arrow)"/>
  <rect class="rus-amber" x="30" y="322" width="240" height="56" rx="8"/>
  <text class="rus-monoc" x="150.0" y="341.0">unsafe impl Send</text>
  <text class="rus-monoc" x="150.0" y="359.0">for RawBuf {}</text>
  <text class="rus-note" x="30" y="402">unsafe impl 은 컴파일러가 검증하지 않는다.</text>
  <text class="rus-note" x="30" y="422">판단이 틀리면 data race 로 UB 가 될 수 있다.</text>
</svg>
