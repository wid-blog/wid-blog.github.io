<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 484" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rus-safe-boundary-title">
  <title id="rus-safe-boundary-title">What the compiler checks inside a safe function and what the author answers for</title>
  <style>
    .rus-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-tl { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rus-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rus-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rus-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rus-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rus-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rus-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rus-dash { stroke-dasharray: 5 4; }
    .rus-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rus-safe-boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rus-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rus-blue" x="40" y="20" width="400" height="56" rx="8"/>
  <text class="rus-t" x="240.0" y="39.0">safe calling code</text>
  <text class="rus-monoc" x="240.0" y="57.0">split_at_mut(&amp;mut values, 2)</text>
  <line class="rus-line" x1="240" y1="76" x2="240" y2="103" marker-end="url(#rus-safe-boundary-arrow)"/>
  <rect class="rus-group" x="20" y="104" width="440" height="234" rx="12"/>
  <text class="rus-sub" x="36" y="124">inside safe fn split_at_mut</text>
  <rect class="rus-green" x="36" y="140" width="408" height="56" rx="8"/>
  <text class="rus-t" x="240.0" y="159.0">checked by the compiler</text>
  <text class="rus-t" x="240.0" y="177.0">types · borrow rules · returned lifetimes</text>
  <rect class="rus-amber" x="36" y="204" width="408" height="56" rx="8"/>
  <text class="rus-t" x="240.0" y="223.0">checked by the author</text>
  <text class="rus-monoc" x="240.0" y="241.0">assert!(mid &lt;= len)</text>
  <rect class="rus-amber" x="36" y="268" width="408" height="56" rx="8"/>
  <text class="rus-t" x="240.0" y="287.0">author's responsibility (SAFETY comment)</text>
  <text class="rus-t" x="240.0" y="305.0">two from_raw_parts_mut calls in unsafe</text>
  <line class="rus-line" x1="240" y1="338" x2="240" y2="365" marker-end="url(#rus-safe-boundary-arrow)"/>
  <rect class="rus-green" x="40" y="366" width="400" height="56" rx="8"/>
  <text class="rus-t" x="240.0" y="385.0">returned value</text>
  <text class="rus-t" x="240.0" y="403.0">two non-overlapping &amp;mut [i32]</text>
  <text class="rus-note" x="20" y="444">If unsafe relies on a struct field, safe code in the module</text>
  <text class="rus-note" x="20" y="464">that can change that field is in scope too. Keep it private.</text>
</svg>
