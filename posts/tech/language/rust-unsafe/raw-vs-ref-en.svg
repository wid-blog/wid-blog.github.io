<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rus-raw-vs-ref-title">
  <title id="rus-raw-vs-ref-title">The compiler checks references; for raw pointers it only gates dereferencing behind unsafe</title>
  <style>
    .rus-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-tl { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rus-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rus-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rus-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .rus-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rus-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rus-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rus-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rus-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rus-dash { stroke-dasharray: 5 4; }
    .rus-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rus-raw-vs-ref-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rus-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <text class="rus-sub" x="20" y="38">Property</text>
  <rect class="rus-green" x="158" y="20" width="142" height="36" rx="8"/>
  <text class="rus-monoc" x="229" y="38">&amp;T · &amp;mut T</text>
  <rect class="rus-amber" x="308" y="20" width="152" height="36" rx="8"/>
  <text class="rus-monoc" x="384" y="38">*const T · *mut T</text>
  <rect class="rus-group" x="20" y="64" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="82">null</text>
  <rect class="rus-green" x="158" y="64" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="82">never</text>
  <rect class="rus-amber" x="308" y="64" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="82">allowed</text>
  <rect class="rus-group" x="20" y="106" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="124">valid memory</text>
  <rect class="rus-green" x="158" y="106" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="124">always</text>
  <rect class="rus-amber" x="308" y="106" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="124">not guaranteed</text>
  <rect class="rus-group" x="20" y="148" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="166">borrow rules</text>
  <rect class="rus-green" x="158" y="148" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="166">checked</text>
  <rect class="rus-amber" x="308" y="148" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="166">not checked</text>
  <rect class="rus-group" x="20" y="190" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="208">lifetime</text>
  <rect class="rus-green" x="158" y="190" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="208">yes</text>
  <rect class="rus-amber" x="308" y="190" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="208">no</text>
  <rect class="rus-group" x="20" y="232" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="250">create</text>
  <rect class="rus-green" x="158" y="232" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="250">safe</text>
  <rect class="rus-amber" x="308" y="232" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="250">safe</text>
  <rect class="rus-group" x="20" y="274" width="130" height="36" rx="8"/>
  <text class="rus-t" x="85" y="292">dereference</text>
  <rect class="rus-green" x="158" y="274" width="142" height="36" rx="8"/>
  <text class="rus-t" x="229" y="292">safe</text>
  <rect class="rus-amber" x="308" y="274" width="152" height="36" rx="8"/>
  <text class="rus-t" x="384" y="292">in unsafe only</text>
</svg>
