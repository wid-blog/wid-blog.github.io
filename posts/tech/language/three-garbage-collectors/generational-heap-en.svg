<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 164" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tgc-generational-heap-title">
  <title id="tgc-generational-heap-title">JVM heap generations — Eden, Survivor 0 and Survivor 1 in Young, and Old where long-lived objects are promoted</title>
  <style>
    .tgc-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tgc-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tgc-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tgc-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tgc-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tgc-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tgc-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tgc-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tgc-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tgc-dash { stroke-dasharray: 5 4; }
    .tgc-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tgc-head { fill: var(--secondary); }
  </style>
  <rect class="tgc-amber" x="20" y="20" width="138.67" height="56" rx="8"/>
  <text class="tgc-t" x="89.33" y="39">Eden</text>
  <text class="tgc-t" x="89.33" y="57">(new allocations)</text>
  <rect class="tgc-green" x="170.67" y="20" width="138.67" height="56" rx="8"/>
  <text class="tgc-t" x="240" y="48">Survivor 0</text>
  <rect class="tgc-green" x="321.33" y="20" width="138.67" height="56" rx="8"/>
  <text class="tgc-t" x="390.67" y="48">Survivor 1</text>
  <rect class="tgc-blue" x="20" y="88" width="440" height="56" rx="8"/>
  <text class="tgc-t" x="240" y="107">Old (Tenured)</text>
  <text class="tgc-t" x="240" y="125">(promoted long-lived objects)</text>
</svg>
