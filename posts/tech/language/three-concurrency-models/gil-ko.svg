<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="ccm-gil-title">
  <title id="ccm-gil-title">CPython GIL — 스레드가 GIL 을 번갈아 잡아서, 한 번에 한 스레드만 바이트코드를 실행한다</title>
  <style>
    .ccm-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ccm-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ccm-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ccm-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .ccm-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .ccm-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .ccm-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .ccm-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .ccm-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .ccm-dash { stroke-dasharray: 5 4; }
    .ccm-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .ccm-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="ccm-gil-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="ccm-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="ccm-life" x1="100" y1="56" x2="100" y2="332"/>
  <line class="ccm-life" x1="280" y1="56" x2="280" y2="332"/>
  <line class="ccm-life" x1="460" y1="56" x2="460" y2="332"/>
  <rect class="ccm-blue" x="40" y="20" width="120" height="36" rx="8"/>
  <text class="ccm-t" x="100" y="38">Thread 1</text>
  <rect class="ccm-amber" x="220" y="20" width="120" height="36" rx="8"/>
  <text class="ccm-t" x="280" y="38">GIL</text>
  <rect class="ccm-blue" x="400" y="20" width="120" height="36" rx="8"/>
  <text class="ccm-t" x="460" y="38">Thread 2</text>
  <text class="ccm-msg" x="190" y="73">acquire</text>
  <line class="ccm-line" x1="100" y1="84" x2="279" y2="84" marker-end="url(#ccm-gil-arrow)"/>
  <rect class="ccm-group" x="25" y="100" width="150" height="30" rx="6"/>
  <text class="ccm-msg" x="100" y="115">바이트코드 실행</text>
  <text class="ccm-msg" x="190" y="147">release (interval 도달)</text>
  <line class="ccm-line" x1="100" y1="158" x2="279" y2="158" marker-end="url(#ccm-gil-arrow)"/>
  <text class="ccm-msg" x="370" y="187">acquire</text>
  <line class="ccm-line" x1="460" y1="198" x2="281" y2="198" marker-end="url(#ccm-gil-arrow)"/>
  <rect class="ccm-group" x="385" y="214" width="150" height="30" rx="6"/>
  <text class="ccm-msg" x="460" y="229">바이트코드 실행</text>
  <text class="ccm-msg" x="370" y="261">release</text>
  <line class="ccm-line" x1="460" y1="272" x2="281" y2="272" marker-end="url(#ccm-gil-arrow)"/>
  <text class="ccm-msg" x="190" y="301">acquire</text>
  <line class="ccm-line" x1="100" y1="312" x2="279" y2="312" marker-end="url(#ccm-gil-arrow)"/>
</svg>
