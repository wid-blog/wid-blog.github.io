<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 272" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rrb-slice-layout-title">
  <title id="rrb-slice-layout-title">&amp;String 은 String 을 가리키는 포인터 하나, &amp;str 은 힙 버퍼 안을 가리키는 포인터와 길이</title>
  <style>
    .rrb-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rrb-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rrb-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rrb-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rrb-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rrb-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
    .rrb-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rrb-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rrb-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rrb-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rrb-ghost { fill: none; stroke: var(--secondary); stroke-width: 1; stroke-dasharray: 5 4; }
    .rrb-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rrb-dash { stroke-dasharray: 5 4; }
    .rrb-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rrb-slice-layout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rrb-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <text class="rrb-mono" x="20" y="46">&amp;line: &amp;String</text>
  <rect class="rrb-green" x="180" y="30" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="212" y="46">ptr</text>
  <text class="rrb-note" x="256" y="46">8바이트</text>
  <line class="rrb-line" x1="212" y1="63" x2="212" y2="81" marker-end="url(#rrb-slice-layout-arrow)"/>
  <text class="rrb-mono" x="20" y="98">line: String</text>
  <rect class="rrb-blue" x="180" y="82" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="212" y="98">ptr</text>
  <rect class="rrb-blue" x="244" y="82" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="276" y="98">len 11</text>
  <rect class="rrb-blue" x="308" y="82" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="340" y="98">cap 11</text>
  <text class="rrb-note" x="384" y="98">24바이트</text>
  <line class="rrb-line" x1="212" y1="115" x2="212" y2="151" marker-end="url(#rrb-slice-layout-arrow)"/>
  <text class="rrb-sub" x="20" y="168">힙 버퍼</text>
  <rect class="rrb-green" x="200" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="212" y="168">G</text>
  <rect class="rrb-green" x="224" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="236" y="168">E</text>
  <rect class="rrb-green" x="248" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="260" y="168">T</text>
  <rect class="rrb-group" x="272" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="284" y="168">␣</text>
  <rect class="rrb-group" x="296" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="308" y="168">/</text>
  <rect class="rrb-group" x="320" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="332" y="168">h</text>
  <rect class="rrb-group" x="344" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="356" y="168">e</text>
  <rect class="rrb-group" x="368" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="380" y="168">a</text>
  <rect class="rrb-group" x="392" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="404" y="168">l</text>
  <rect class="rrb-group" x="416" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="428" y="168">t</text>
  <rect class="rrb-group" x="440" y="152" width="24" height="32" rx="4"/>
  <text class="rrb-monoc" x="452" y="168">h</text>
  <text class="rrb-mono" x="20" y="238">method: &amp;str</text>
  <rect class="rrb-green" x="180" y="222" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="212" y="238">ptr</text>
  <rect class="rrb-green" x="244" y="222" width="64" height="32" rx="6"/>
  <text class="rrb-t" x="276" y="238">len 3</text>
  <text class="rrb-note" x="320" y="238">16바이트</text>
  <line class="rrb-line" x1="212" y1="221" x2="212" y2="185" marker-end="url(#rrb-slice-layout-arrow)"/>
</svg>
