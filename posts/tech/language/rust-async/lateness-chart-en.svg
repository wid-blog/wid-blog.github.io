<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 318" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="ras-lateness-chart-title">
  <title id="ras-lateness-chart-title">Only ThreadSleep pushed the worst ticker delay past 200ms</title>
  <style>
    .ras-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-tl { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-msgl { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-msge { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: end; dominant-baseline: central; }
    .ras-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .ras-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .ras-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .ras-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .ras-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .ras-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .ras-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .ras-dash { stroke-dasharray: 5 4; }
    .ras-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .ras-axis { stroke: var(--tertiary); stroke-width: 1; }
    .ras-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="ras-lateness-chart-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="ras-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <text class="ras-sub" x="20" y="24">worst ticker delay (3 runs)</text>
  <text class="ras-mono" x="20" y="74">AsyncSleep</text>
  <rect class="ras-blue" x="140" y="48" width="11.7" height="14" rx="3"/>
  <text class="ras-msgl" x="157.7" y="55">9.8ms</text>
  <rect class="ras-blue" x="140" y="66" width="7.9" height="14" rx="3"/>
  <text class="ras-msgl" x="153.9" y="73">6.6ms</text>
  <rect class="ras-blue" x="140" y="84" width="5.4" height="14" rx="3"/>
  <text class="ras-msgl" x="151.4" y="91">4.5ms</text>
  <text class="ras-mono" x="20" y="146">ThreadSleep</text>
  <rect class="ras-amber" x="140" y="120" width="243.0" height="14" rx="3"/>
  <text class="ras-msgl" x="389.0" y="127">204.1ms</text>
  <rect class="ras-amber" x="140" y="138" width="241.0" height="14" rx="3"/>
  <text class="ras-msgl" x="387.0" y="145">202.4ms</text>
  <rect class="ras-amber" x="140" y="156" width="245.1" height="14" rx="3"/>
  <text class="ras-msgl" x="391.1" y="163">205.9ms</text>
  <text class="ras-mono" x="20" y="218">SpawnBlocking</text>
  <rect class="ras-green" x="140" y="192" width="7.6" height="14" rx="3"/>
  <text class="ras-msgl" x="153.6" y="199">6.4ms</text>
  <rect class="ras-green" x="140" y="210" width="3.3" height="14" rx="3"/>
  <text class="ras-msgl" x="149.3" y="217">2.8ms</text>
  <rect class="ras-green" x="140" y="228" width="8.0" height="14" rx="3"/>
  <text class="ras-msgl" x="154.0" y="235">6.7ms</text>
  <line class="ras-axis" x1="140" y1="258" x2="390" y2="258"/>
  <line class="ras-axis" x1="140.0" y1="254" x2="140.0" y2="262"/>
  <text class="ras-msg" x="140.0" y="274">0ms</text>
  <line class="ras-axis" x1="259.0" y1="254" x2="259.0" y2="262"/>
  <text class="ras-msg" x="259.0" y="274">100ms</text>
  <line class="ras-axis" x1="378.1" y1="254" x2="378.1" y2="262"/>
  <text class="ras-msg" x="378.1" y="274">200ms</text>
  <text class="ras-note" x="240" y="298">load average 82–91, 2 workers, four 100ms jobs</text>
</svg>
