<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="ras-poll-waker-title">
  <title id="ras-poll-waker-title">A future that returns Pending keeps the Waker, and the executor polls again when wake is called</title>
  <style>
    .ras-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-tl { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-msgl { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-msge { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: end; dominant-baseline: central; }
    .ras-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .ras-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .ras-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .ras-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; white-space: pre; }
    .ras-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .ras-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .ras-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .ras-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .ras-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .ras-dash { stroke-dasharray: 5 4; }
    .ras-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .ras-axis { stroke: var(--tertiary); stroke-width: 1; }
    .ras-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="ras-poll-waker-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="ras-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="ras-blue" x="25" y="20" width="100" height="36" rx="8"/>
  <text class="ras-t" x="75" y="38">executor</text>
  <line class="ras-life" x1="75" y1="56" x2="75" y2="546"/>
  <rect class="ras-group" x="135" y="20" width="100" height="36" rx="8"/>
  <text class="ras-t" x="185" y="38">handler</text>
  <line class="ras-life" x1="185" y1="56" x2="185" y2="546"/>
  <rect class="ras-group" x="245" y="20" width="100" height="36" rx="8"/>
  <text class="ras-t" x="295" y="38">Delay</text>
  <line class="ras-life" x1="295" y1="56" x2="295" y2="546"/>
  <rect class="ras-green" x="355" y="20" width="100" height="36" rx="8"/>
  <text class="ras-t" x="405" y="38">timer thread</text>
  <line class="ras-life" x1="405" y1="56" x2="405" y2="546"/>
  <line class="ras-line" x1="75" y1="88" x2="184" y2="88" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="130.0" y="77">poll #1</text>
  <line class="ras-line" x1="185" y1="128" x2="294" y2="128" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="240.0" y="117">poll</text>
  <line class="ras-line" x1="295" y1="168" x2="404" y2="168" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="350.0" y="157">start timer</text>
  <rect class="ras-group" x="237" y="193" width="116" height="30" rx="6"/>
  <text class="ras-msg" x="295.0" y="208">keep Waker clone</text>
  <line class="ras-line ras-dash" x1="295" y1="248" x2="186" y2="248" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="240.0" y="237">Pending</text>
  <line class="ras-line ras-dash" x1="185" y1="288" x2="76" y2="288" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="130.0" y="277">Pending</text>
  <rect class="ras-group" x="17" y="313" width="116" height="30" rx="6"/>
  <text class="ras-msg" x="75.0" y="328">park (sleep)</text>
  <line class="ras-line" x1="405" y1="368" x2="76" y2="368" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="240.0" y="357">wake() → unpark</text>
  <line class="ras-line" x1="75" y1="408" x2="184" y2="408" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="130.0" y="397">poll #2</text>
  <line class="ras-line" x1="185" y1="448" x2="294" y2="448" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="240.0" y="437">poll</text>
  <line class="ras-line ras-dash" x1="295" y1="488" x2="186" y2="488" marker-end="url(#ras-poll-waker-arrow)"/>
  <text class="ras-msg" x="240.0" y="477">Ready(())</text>
  <rect class="ras-green" x="105" y="513" width="160" height="30" rx="6"/>
  <text class="ras-msg" x="185.0" y="528">run to the next .await</text>
</svg>
