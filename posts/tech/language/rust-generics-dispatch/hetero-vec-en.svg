<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 332" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rgd-hetero-vec-title">
  <title id="rgd-hetero-vec-title">Vec&lt;Circle&gt; holds one type; Vec&lt;Box&lt;dyn Shape&gt;&gt; holds a data pointer and a vtable pointer per element</title>
  <style>
    .rgd-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rgd-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rgd-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rgd-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rgd-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rgd-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
    .rgd-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rgd-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rgd-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rgd-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rgd-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rgd-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rgd-hetero-vec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rgd-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rgd-group" x="16" y="16" width="448" height="96" rx="12"/>
  <text class="rgd-sub" x="32" y="36">Vec&lt;Circle&gt; — a single element type</text>
  <rect class="rgd-blue" x="32" y="52" width="88" height="32" rx="8"/>
  <text class="rgd-t" x="76" y="68">Circle</text>
  <rect class="rgd-blue" x="128" y="52" width="88" height="32" rx="8"/>
  <text class="rgd-t" x="172" y="68">Circle</text>
  <rect class="rgd-blue" x="224" y="52" width="88" height="32" rx="8"/>
  <text class="rgd-t" x="268" y="68">Circle</text>
  <rect class="rgd-amber" x="320" y="52" width="128" height="32" rx="8"/>
  <text class="rgd-t" x="384" y="68">Rect ✕ E0308</text>
  <text class="rgd-note" x="32" y="98">same-size elements, stored contiguously</text>
  <rect class="rgd-group" x="16" y="128" width="448" height="188" rx="12"/>
  <text class="rgd-sub" x="32" y="148">Vec&lt;Box&lt;dyn Shape&gt;&gt; — 16 bytes per element</text>
  <text class="rgd-note" x="32" y="172">[0]</text>
  <rect class="rgd-green" x="32" y="184" width="100" height="32" rx="8"/>
  <text class="rgd-t" x="82" y="200">data</text>
  <rect class="rgd-amber" x="132" y="184" width="100" height="32" rx="8"/>
  <text class="rgd-t" x="182" y="200">vtable</text>
  <line class="rgd-line" x1="82" y1="217" x2="82" y2="251" marker-end="url(#rgd-hetero-vec-arrow)"/>
  <line class="rgd-line" x1="182" y1="217" x2="182" y2="251" marker-end="url(#rgd-hetero-vec-arrow)"/>
  <rect class="rgd-blue" x="32" y="252" width="96" height="52" rx="8"/>
  <text class="rgd-t" x="80" y="269">Circle</text>
  <text class="rgd-t" x="80" y="287">8 bytes</text>
  <rect class="rgd-amber" x="136" y="252" width="96" height="52" rx="8"/>
  <text class="rgd-t" x="184" y="269">vtable</text>
  <text class="rgd-t" x="184" y="287">(Circle)</text>
  <text class="rgd-note" x="248" y="172">[1]</text>
  <rect class="rgd-green" x="248" y="184" width="100" height="32" rx="8"/>
  <text class="rgd-t" x="298" y="200">data</text>
  <rect class="rgd-amber" x="348" y="184" width="100" height="32" rx="8"/>
  <text class="rgd-t" x="398" y="200">vtable</text>
  <line class="rgd-line" x1="298" y1="217" x2="298" y2="251" marker-end="url(#rgd-hetero-vec-arrow)"/>
  <line class="rgd-line" x1="398" y1="217" x2="398" y2="251" marker-end="url(#rgd-hetero-vec-arrow)"/>
  <rect class="rgd-blue" x="248" y="252" width="96" height="52" rx="8"/>
  <text class="rgd-t" x="296" y="269">Rect</text>
  <text class="rgd-t" x="296" y="287">16 bytes</text>
  <rect class="rgd-amber" x="352" y="252" width="96" height="52" rx="8"/>
  <text class="rgd-t" x="400" y="269">vtable</text>
  <text class="rgd-t" x="400" y="287">(Rect)</text>
</svg>
