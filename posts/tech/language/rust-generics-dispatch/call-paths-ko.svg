<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 376" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="rgd-call-paths-title">
  <title id="rgd-call-paths-title">정적 호출은 area 본문이 인라인되고, dyn 호출은 vtable 에서 주소를 읽어 간접 분기한다</title>
  <style>
    .rgd-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rgd-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .rgd-note { fill: var(--secondary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rgd-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .rgd-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; white-space: pre; }
    .rgd-monoc { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
    .rgd-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .rgd-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .rgd-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .rgd-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .rgd-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .rgd-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="rgd-call-paths-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="rgd-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="rgd-group" x="16" y="16" width="448" height="160" rx="12"/>
  <text class="rgd-sub" x="32" y="36">area_static(shape: &amp;Circle)</text>
  <rect class="rgd-green" x="32" y="52" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="65">ldr  d0, [x0]</text>
  <text class="rgd-note" x="240" y="65">radius 읽기</text>
  <rect class="rgd-green" x="32" y="82" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="95">mov/movk ×4, fmov</text>
  <text class="rgd-note" x="240" y="95">상수 3.14 만들기</text>
  <rect class="rgd-green" x="32" y="112" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="125">fmul ×2</text>
  <text class="rgd-note" x="240" y="125">3.14 × r × r</text>
  <rect class="rgd-green" x="32" y="142" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="155">ret</text>
  <text class="rgd-note" x="240" y="155">반환</text>
  <rect class="rgd-group" x="16" y="192" width="448" height="168" rx="12"/>
  <text class="rgd-sub" x="32" y="212">area_dyn(shape: &amp;dyn Shape)</text>
  <text class="rgd-note" x="32" y="236">인자 두 레지스터: x0 = data, x1 = vtable</text>
  <rect class="rgd-amber" x="32" y="252" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="265">ldr  x1, [x1, #24]</text>
  <text class="rgd-note" x="240" y="265">vtable +24 칸의 area 주소</text>
  <rect class="rgd-amber" x="32" y="282" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="295">br   x1</text>
  <text class="rgd-note" x="240" y="295">그 주소로 간접 분기</text>
  <line class="rgd-line" x1="130" y1="309" x2="130" y2="323" marker-end="url(#rgd-call-paths-arrow)"/>
  <rect class="rgd-green" x="32" y="324" width="196" height="26" rx="6"/>
  <text class="rgd-mono" x="44" y="337">Circle::area</text>
  <text class="rgd-note" x="240" y="337">본문 실행 후 반환</text>
</svg>
