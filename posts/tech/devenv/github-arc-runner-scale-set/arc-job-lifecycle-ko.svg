<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 632" width="100%" style="display: block; max-width: 720px; margin: 0 auto" role="img" aria-labelledby="arc-job-lifecycle-title">
  <title id="arc-job-lifecycle-title">ARC job 생애주기</title>
  <defs>
    <marker id="arc-job-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-small { fill: var(--secondary); font: 12px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-code { fill: var(--primary); font: bold 14px monospace; text-anchor: middle; dominant-baseline: central; }
    .d-group-text { fill: var(--secondary); font: 13px sans-serif; text-anchor: start; dominant-baseline: central; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-label-bg { fill: var(--entry); }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-life { stroke: var(--tertiary); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .d-dot { stroke-dasharray: 4 3; }
    .d-accent { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-ok { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-ok-strong { fill: rgba(60, 160, 90, 0.34); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-warm { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-bad { fill: rgba(210, 70, 70, 0.14); stroke: rgb(210, 70, 70); stroke-width: 1.5; }
    .d-violet { fill: rgba(150, 90, 200, 0.14); stroke: rgb(150, 90, 200); stroke-width: 1.5; }
    .d-mute { fill: rgba(128, 128, 128, 0.14); stroke: rgb(128, 128, 128); stroke-width: 1.5; }
    .d-band { fill: rgba(128, 128, 128, 0.05); stroke: none; }
  </style>

  <line class="d-life" x1="110" y1="50" x2="110" y2="622"/>
  <line class="d-life" x1="290" y1="50" x2="290" y2="622"/>
  <line class="d-life" x1="470" y1="50" x2="470" y2="622"/>
  <line class="d-life" x1="630" y1="50" x2="630" y2="622"/>
  <rect class="d-band" x="10" y="70" width="700" height="126" rx="4"/>
  <text class="d-group-text" x="20" y="83">준비</text>
  <path class="d-line" d="M470,100 L114,100" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="225.04" y="80" width="129.92000000000002" height="18" rx="3"/>
  <text class="d-small" x="290.0" y="89">scale set 조회·생성</text>
  <path class="d-line" d="M470,134 L294,134" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="320.32" y="114" width="119.36000000000001" height="18" rx="3"/>
  <text class="d-small" x="380.0" y="123">listener pod 생성</text>
