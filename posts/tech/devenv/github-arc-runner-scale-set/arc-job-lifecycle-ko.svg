  <rect class="d-label-bg" x="152.32" y="218" width="95.36000000000001" height="18" rx="3"/>
  <text class="d-small" x="200.0" y="227">Job Available</text>
  <path class="d-line" d="M290,272 L466,272" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="265.12" y="252" width="229.76000000000002" height="18" rx="3"/>
  <text class="d-small" x="380.0" y="261">EphemeralRunnerSet replicas patch</text>
