  <path class="d-line" d="M470,340 L626,340" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="497.04" y="320" width="105.92" height="18" rx="3"/>
  <text class="d-small" x="550.0" y="329">runner pod 생성</text>
  <rect class="d-band" x="10" y="380" width="700" height="126" rx="4"/>
  <text class="d-group-text" x="20" y="393">실행</text>
  <path class="d-line" d="M630,410 L114,410" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="279.6" y="390" width="180.8" height="18" rx="3"/>
  <text class="d-small" x="370.0" y="399">JIT 토큰으로 등록·long poll</text>
  <path class="d-line" d="M110,444 L626,444" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="325.2" y="424" width="89.60000000000001" height="18" rx="3"/>
  <text class="d-small" x="370.0" y="433">job 상세 전달</text>
  <path class="d-line" d="M630,478 L114,478" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="323.28" y="458" width="93.44" height="18" rx="3"/>
  <text class="d-small" x="370.0" y="467">로그·상태 전송</text>
  <rect class="d-band" x="10" y="518" width="700" height="92" rx="4"/>
  <text class="d-group-text" x="20" y="531">정리</text>
  <path class="d-line" d="M470,548 L114,548" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="227.92000000000002" y="528" width="124.16" height="18" rx="3"/>
  <text class="d-small" x="290.0" y="537">삭제 가능 여부 확인</text>
  <path class="d-line" d="M470,582 L626,582" marker-end="url(#arc-job-lifecycle-arrow)"/>
  <rect class="d-label-bg" x="466.8" y="562" width="166.4" height="18" rx="3"/>
  <text class="d-small" x="550.0" y="571">EphemeralRunner·pod 삭제</text>
  <rect class="d-accent" x="39.19999999999999" y="10" width="141.60000000000002" height="40" rx="4" ry="4"/>
  <text class="d-text" x="110.0" y="30.0">Actions Service</text>
  <rect class="d-warm" x="246.64" y="10" width="86.72" height="40" rx="4" ry="4"/>
  <text class="d-text" x="290.0" y="30.0">listener</text>
  <rect class="d-mute" x="418.8" y="10" width="102.4" height="40" rx="4" ry="4"/>
  <text class="d-text" x="470.0" y="30.0">controller</text>
  <rect class="d-ok" x="578.8" y="10" width="102.4" height="40" rx="4" ry="4"/>
  <text class="d-text" x="630.0" y="30.0">runner pod</text>
</svg>
