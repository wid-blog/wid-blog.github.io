<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" style="display: block; max-width: 500px; margin: 0 auto" role="img" aria-labelledby="bbr-operating-point-title">
  <title id="bbr-operating-point-title">RTT and delivery rate vs. inflight</title>
  <defs>
    <marker id="bbr-operating-point-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="bbr-operating-point-arrow-ai" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: rgb(60, 160, 90)"/>
    </marker>
    <marker id="bbr-operating-point-arrow-md" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: rgb(220, 130, 40)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 13px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-text-start { fill: var(--primary); font: 13px sans-serif; text-anchor: start; dominant-baseline: central; }
    .d-text-end { fill: var(--primary); font: 13px sans-serif; text-anchor: end; dominant-baseline: central; }
    .d-sub { fill: var(--secondary); font: 12px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-sub-start { fill: var(--secondary); font: 12px sans-serif; text-anchor: start; dominant-baseline: central; }
    .d-axis { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-guide { stroke: var(--tertiary); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-ai { stroke: rgb(60, 160, 90); stroke-width: 2; fill: none; }
    .d-md { stroke: rgb(220, 130, 40); stroke-width: 2; fill: none; }
    .d-curve-a { stroke: rgb(70, 130, 220); stroke-width: 2.5; fill: none; }
    .d-curve-b { stroke: rgb(220, 130, 40); stroke-width: 2.5; fill: none; }
    .d-loss { fill: rgb(210, 70, 70); }
    .d-point { fill: rgb(70, 130, 220); }
    .d-ok-zone { fill: rgba(60, 160, 90, 0.10); }
    .d-warm-zone { fill: rgba(220, 130, 40, 0.10); }
    .d-bad-zone { fill: rgba(210, 70, 70, 0.10); }
  </style>
  <rect class="d-ok-zone" x="70" y="34" width="150" height="306"/>
  <rect class="d-warm-zone" x="220" y="34" width="180" height="306"/>
  <rect class="d-bad-zone" x="400" y="34" width="70" height="306"/>
  <text class="d-sub" x="145.0" y="46">App-limited</text>
  <text class="d-sub" x="310.0" y="46">Bandwidth-limited</text>
  <text class="d-sub" x="435.0" y="46">Buffer-limited</text>
  <path class="d-axis" d="M70,50 L70,170 L470,170"/>
  <text class="d-text" x="44" y="110.0" transform="rotate(-90 44 110.0)">RTT</text>
  <path class="d-curve-a" d="M70,140 L220,140 L400,70"/>
  <text class="d-sub-start" x="78" y="154">RTprop (propagation delay)</text>
  <path class="d-axis" d="M70,200 L70,320 L470,320"/>
  <text class="d-text" x="44" y="260.0" transform="rotate(-90 44 260.0)">Delivery rate</text>
  <path class="d-curve-a" d="M70,320 L220,230 L400,230"/>
  <text class="d-sub-start" x="228" y="218">BtlBw (bottleneck bandwidth)</text>
  <path class="d-guide" d="M220,50 L220,340"/>
  <path class="d-guide" d="M400,50 L400,340"/>
  <text class="d-sub" x="220" y="352">BDP</text>
  <text class="d-sub" x="400" y="352">BDP + buffer</text>
  <circle class="d-point" cx="220" cy="140" r="5"/>
  <circle class="d-point" cx="220" cy="230" r="5"/>
  <circle class="d-loss" cx="400" cy="70" r="5"/>
  <circle class="d-loss" cx="400" cy="230" r="5"/>
  <text class="d-text" x="270.0" y="374">Data in flight →</text>
  <circle class="d-point" cx="76" cy="402" r="5"/>
  <text class="d-text-start" x="86" y="402">BBR operating point</text>
  <circle class="d-loss" cx="276" cy="402" r="5"/>
  <text class="d-text-start" x="286" y="402">Loss-based operating point</text>
</svg>
