<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" style="display: block; max-width: 400px; margin: 0 auto" role="img" aria-labelledby="aimd-phase-plot-title">
  <title id="aimd-phase-plot-title">AIMD 의 공정성 수렴 (Chiu–Jain phase plot)</title>
  <defs>
    <marker id="aimd-phase-plot-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="aimd-phase-plot-arrow-ai" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: rgb(60, 160, 90)"/>
    </marker>
    <marker id="aimd-phase-plot-arrow-md" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: rgb(220, 130, 40)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 13px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-text-start { fill: var(--primary); font: 13px sans-serif; text-anchor: start; dominant-baseline: central; }
    .d-text-end { fill: var(--primary); font: 13px sans-serif; text-anchor: end; dominant-baseline: central; }
    .d-sub { fill: var(--secondary); font: 12px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-sub-start { fill: var(--secondary); font: 12px sans-serif; text-anchor: start; dominant-baseline: central; }
    .d-axis { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-guide { stroke: var(--tertiary); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-ai { stroke: rgb(60, 160, 90); stroke-width: 2; fill: none; }
    .d-md { stroke: rgb(220, 130, 40); stroke-width: 2; fill: none; }
    .d-curve-a { stroke: rgb(70, 130, 220); stroke-width: 2.5; fill: none; }
    .d-curve-b { stroke: rgb(220, 130, 40); stroke-width: 2.5; fill: none; }
    .d-loss { fill: rgb(210, 70, 70); }
    .d-point { fill: rgb(70, 130, 220); }
    .d-ok-zone { fill: rgba(60, 160, 90, 0.10); }
    .d-warm-zone { fill: rgba(220, 130, 40, 0.10); }
    .d-bad-zone { fill: rgba(210, 70, 70, 0.10); }
  </style>
  <path class="d-bad-zone" d="M70.0,70.0 L350.0,350.0 L350.0,70.0 Z"/>
  <path class="d-ok-zone" d="M70.0,350.0 L70.0,70.0 L350.0,350.0 Z"/>
  <path class="d-axis" d="M70.0,47.6 L70.0,350.0 L372.4,350.0"/>
  <path class="d-guide" d="M70.0,350.0 L350.0,70.0"/>
  <path class="d-guide" d="M70.0,70.0 L350.0,350.0"/>
  <path class="d-ai" d="M98.0,238.0 L165.9,170.1" marker-end="url(#aimd-phase-plot-arrow-ai)"/>
  <path class="d-md" d="M168.0,168.0 L120.4,256.4" marker-end="url(#aimd-phase-plot-arrow-md)"/>
  <path class="d-ai" d="M119.0,259.0 L186.9,191.1" marker-end="url(#aimd-phase-plot-arrow-ai)"/>
  <path class="d-md" d="M189.0,189.0 L131.3,267.1" marker-end="url(#aimd-phase-plot-arrow-md)"/>
  <path class="d-ai" d="M129.5,269.5 L197.4,201.6" marker-end="url(#aimd-phase-plot-arrow-ai)"/>
  <path class="d-md" d="M199.5,199.5 L136.7,272.5" marker-end="url(#aimd-phase-plot-arrow-md)"/>
  <path class="d-ai" d="M134.8,274.8 L202.6,206.9" marker-end="url(#aimd-phase-plot-arrow-ai)"/>
  <circle class="d-point" cx="98.0" cy="238.0" r="4"/>
  <text class="d-text-end" x="90.0" y="238.0">시작점</text>
  <circle cx="210.0" cy="210.0" r="6" style="fill: none; stroke: var(--primary); stroke-width: 2"/>
  <text class="d-text-start" x="222.0" y="212.0">최적점</text>
  <text class="d-sub" x="310.8" y="95.2" transform="rotate(-45 310.8 95.2)">공정선 x₁ = x₂</text>
  <text class="d-sub" x="118.6" y="136.6" transform="rotate(45 118.6 136.6)">효율선 x₁ + x₂ = C</text>
  <text class="d-sub" x="288.4" y="176.4">과부하 (손실)</text>
  <text class="d-sub" x="243.6" y="316.4">저활용</text>
  <text class="d-text" x="210.0" y="372">연결 1 의 전송률 x₁</text>
  <text class="d-text" x="46" y="210.0" transform="rotate(-90 46 210.0)">연결 2 의 전송률 x₂</text>
  <path class="d-ai" d="M70,400 L98,400" marker-end="url(#aimd-phase-plot-arrow-ai)"/>
  <text class="d-text-start" x="108" y="400">AI: 두 연결이 같은 양만큼 증가</text>
  <path class="d-md" d="M70,422 L98,422" marker-end="url(#aimd-phase-plot-arrow-md)"/>
  <text class="d-text-start" x="108" y="422">MD: 두 연결이 같은 비율로 감소</text>
</svg>
