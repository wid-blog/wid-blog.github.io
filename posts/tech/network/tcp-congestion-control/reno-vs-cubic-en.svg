<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" style="display: block; max-width: 500px; margin: 0 auto" role="img" aria-labelledby="reno-vs-cubic-title">
  <title id="reno-vs-cubic-title">cwnd over time: Reno vs CUBIC</title>
  <defs>
