<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 300.4 315.6" width="100%" style="display: block; max-width: 300.4px; margin: 0 auto" role="img" aria-labelledby="power-two-choices-title">
  <title id="power-two-choices-title">Power of Two Choices</title>
  <defs>
