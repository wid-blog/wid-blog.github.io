<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.5 -10 588.6 303" width="100%" style="display: block; max-width: 588.6px; margin: 0 auto" role="img" aria-labelledby="least-connection-title">
  <title id="least-connection-title">Least Connection</title>
  <defs>
    <marker id="least-connection-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--secondary)"/>
    </marker>
    <marker id="least-connection-arrow-start" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,5 L10,10 L10,0 z" style="fill: var(--secondary)"/>
    </marker>
  </defs>
  <style>
    .d-text { fill: var(--primary); font: 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-group-text { fill: var(--secondary); font: 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .d-box { fill: var(--entry); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1.5; }
    .d-label-bg { fill: var(--entry); }
    .d-line { stroke: var(--secondary); stroke-width: 1.5; fill: none; }
    .d-dot { stroke-dasharray: 4 3; }
    .d-thick { stroke-width: 3; }
    .d-accent { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-accent-strong { fill: rgba(70, 130, 220, 0.34); stroke: rgb(70, 130, 220); stroke-width: 1.5; }
    .d-ok { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-ok-strong { fill: rgba(60, 160, 90, 0.34); stroke: rgb(60, 160, 90); stroke-width: 1.5; }
    .d-warm { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-warm-strong { fill: rgba(220, 130, 40, 0.34); stroke: rgb(220, 130, 40); stroke-width: 1.5; }
    .d-bad { fill: rgba(210, 70, 70, 0.14); stroke: rgb(210, 70, 70); stroke-width: 1.5; }
    .d-bad-strong { fill: rgba(210, 70, 70, 0.34); stroke: rgb(210, 70, 70); stroke-width: 1.5; }
    .d-violet { fill: rgba(150, 90, 200, 0.14); stroke: rgb(150, 90, 200); stroke-width: 1.5; }
    .d-violet-strong { fill: rgba(150, 90, 200, 0.34); stroke: rgb(150, 90, 200); stroke-width: 1.5; }
    .d-yellow { fill: rgba(200, 170, 30, 0.14); stroke: rgb(200, 170, 30); stroke-width: 1.5; }
    .d-yellow-strong { fill: rgba(200, 170, 30, 0.34); stroke: rgb(200, 170, 30); stroke-width: 1.5; }
    .d-mute { fill: rgba(128, 128, 128, 0.14); stroke: rgb(128, 128, 128); stroke-width: 1.5; }
    .d-mute-strong { fill: rgba(128, 128, 128, 0.34); stroke: rgb(128, 128, 128); stroke-width: 1.5; }
  </style>

  <rect class="d-group" x="0.5" y="0" width="289.3" height="184" rx="6"/>
  <text class="d-group-text" x="145.2" y="9.5">HTTP/2의 실제 부하</text>
  <rect class="d-group" x="339.8" y="0" width="229.3" height="184" rx="6"/>
  <text class="d-group-text" x="454.5" y="9.5">LC의 시선 — connection 수만 본다</text>
  <path class="d-line" transform="translate(0,0)" d="M453.961,184L453.961,189.583C453.961,195.167,453.961,206.333,453.961,216.617C453.961,226.9,453.961,236.3,453.961,241L453.961,245.7" marker-end="url(#least-connection-arrow)"/>
  <path class="d-line" transform="translate(0,0)" d="M144.656,184L144.656,189.583C144.656,195.167,144.656,206.333,144.656,216.617C144.656,226.9,144.656,236.3,144.656,241L144.656,245.7" marker-end="url(#least-connection-arrow)"/>
  <rect class="d-label-bg" x="439" y="208" width="30" height="19" rx="3"/>
  <text class="d-text" x="454" y="218.5">결론</text>
  <rect class="d-label-bg" x="129.7" y="208" width="30" height="19" rx="3"/>
  <text class="d-text" x="144.7" y="218.5">실제</text>
  <rect class="d-box" transform="translate(145.2,51)" x="-119.65625" y="-16" width="239.3125" height="32" rx="4" ry="4"/>
  <text class="d-text" x="145.2" y="52">backend A — 1 conn / 50 streams</text>
  <rect class="d-box" transform="translate(145.2,133)" x="-116.3125" y="-16" width="232.625" height="32" rx="4" ry="4"/>
  <text class="d-text" x="145.2" y="134">backend B — 1 conn / 3 streams</text>
  <rect class="d-box" transform="translate(454.5,51)" x="-89.234375" y="-16" width="178.46875" height="32" rx="4" ry="4"/>
  <text class="d-text" x="454.5" y="52">backend A: 1 connection</text>
  <rect class="d-box" transform="translate(454.5,133)" x="-89.6484375" y="-16" width="179.296875" height="32" rx="4" ry="4"/>
  <text class="d-text" x="454.5" y="134">backend B: 1 connection</text>
  <rect class="d-bad" transform="translate(454,267)" x="-87.5234375" y="-16" width="175.046875" height="32" rx="4" ry="4"/>
  <text class="d-text" x="454" y="268">두 backend 동등하게 보임</text>
  <rect class="d-ok" transform="translate(144.7,267)" x="-59.5390625" y="-16" width="119.078125" height="32" rx="4" ry="4"/>
  <text class="d-text" x="144.7" y="268">A가 약 16배 바쁨</text>
</svg>
