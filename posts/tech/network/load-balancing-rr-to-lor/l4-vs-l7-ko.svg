<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 532" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="lbr-l4-vs-l7-title">
  <title id="lbr-l4-vs-l7-title">L4 는 connection 단위로, L7 은 요청 단위로 backend 를 고른다</title>
  <style>
    .lbr-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .lbr-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .lbr-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .lbr-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .lbr-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .lbr-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .lbr-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .lbr-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .lbr-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .lbr-dash { stroke-dasharray: 5 4; }
    .lbr-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .lbr-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="lbr-l4-vs-l7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="lbr-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="lbr-life" x1="80" y1="56" x2="80" y2="512"/>
  <line class="lbr-life" x1="213" y1="56" x2="213" y2="512"/>
  <line class="lbr-life" x1="347" y1="56" x2="347" y2="512"/>
  <line class="lbr-life" x1="480" y1="56" x2="480" y2="512"/>
  <rect class="lbr-blue" x="22" y="20" width="116" height="36" rx="8"/>
  <text class="lbr-t" x="80" y="38">클라이언트</text>
  <rect class="lbr-green" x="155" y="20" width="116" height="36" rx="8"/>
  <text class="lbr-t" x="213" y="38">로드밸런서</text>
  <rect class="lbr-green" x="289" y="20" width="116" height="36" rx="8"/>
  <text class="lbr-t" x="347" y="38">backend A</text>
  <rect class="lbr-green" x="422" y="20" width="116" height="36" rx="8"/>
  <text class="lbr-t" x="480" y="38">backend B</text>
  <rect class="lbr-group" x="22" y="84" width="516" height="30" rx="6"/>
  <text class="lbr-msg" x="280" y="99">L4 — 같은 connection은 항상 같은 backend</text>
  <text class="lbr-msg" x="146.5" y="131">TCP conn 1 (req 1)</text>
  <line class="lbr-line" x1="80" y1="142" x2="212" y2="142" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="280" y="171">req 1</text>
  <line class="lbr-line" x1="213" y1="182" x2="346" y2="182" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="146.5" y="211">TCP conn 1 (req 2)</text>
  <line class="lbr-line" x1="80" y1="222" x2="212" y2="222" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="280" y="251">req 2</text>
  <line class="lbr-line" x1="213" y1="262" x2="346" y2="262" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <rect class="lbr-group" x="22" y="278" width="516" height="30" rx="6"/>
  <text class="lbr-msg" x="280" y="293">L7 — 같은 connection 위 다른 요청 가능</text>
  <text class="lbr-msg" x="146.5" y="325">HTTP req 1</text>
  <text class="lbr-msg" x="146.5" y="343">(stream 1)</text>
  <line class="lbr-line" x1="80" y1="354" x2="212" y2="354" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="280" y="383">req 1</text>
  <line class="lbr-line" x1="213" y1="394" x2="346" y2="394" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="146.5" y="423">HTTP req 2</text>
  <text class="lbr-msg" x="146.5" y="441">(stream 3)</text>
  <line class="lbr-line" x1="80" y1="452" x2="212" y2="452" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
  <text class="lbr-msg" x="280" y="481">req 2</text>
  <line class="lbr-line" x1="213" y1="492" x2="479" y2="492" marker-end="url(#lbr-l4-vs-l7-arrow)"/>
</svg>
