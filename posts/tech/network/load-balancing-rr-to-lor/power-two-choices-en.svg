<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 345.1 315.9" width="100%" style="display: block; max-width: 345.1px; margin: 0 auto" role="img" aria-labelledby="power-two-choices-title">
  <title id="power-two-choices-title">Power of Two Choices</title>
  <defs>
