<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tlsh-crypto-types-title">
  <title id="tlsh-crypto-types-title">대칭 암호화는 빠르지만 키 공유가 문제이고, 비대칭 암호화는 키 공유를 풀지만 느리다</title>
  <style>
    .tlsh-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tlsh-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tlsh-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tlsh-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tlsh-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tlsh-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tlsh-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tlsh-dash { stroke-dasharray: 5 4; }
    .tlsh-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tlsh-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="tlsh-crypto-types-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tlsh-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="tlsh-group" x="20" y="20" width="214" height="176" rx="12"/>
  <text class="tlsh-sub" x="36" y="40">대칭 암호화</text>
  <rect class="tlsh-blue" x="36" y="56" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="127" y="74">같은 키로 암·복호화</text>
  <rect class="tlsh-blue" x="36" y="100" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="127" y="118">빠름</text>
  <rect class="tlsh-blue" x="36" y="144" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="127" y="162">키 공유 문제</text>
  <rect class="tlsh-group" x="246" y="20" width="214" height="176" rx="12"/>
  <text class="tlsh-sub" x="262" y="40">비대칭 암호화</text>
  <rect class="tlsh-green" x="262" y="56" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="353" y="74">공개키 / 개인키 쌍</text>
  <rect class="tlsh-green" x="262" y="100" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="353" y="118">키 공유 해결</text>
  <rect class="tlsh-green" x="262" y="144" width="182" height="36" rx="8"/>
  <text class="tlsh-t" x="353" y="162">느림</text>
</svg>
