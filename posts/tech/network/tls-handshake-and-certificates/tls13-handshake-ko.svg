<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tlsh-tls13-handshake-title">
  <title id="tlsh-tls13-handshake-title">TLS 1.3 핸드셰이크 — ClientHello 에 키 공유를 실어 1-RTT 만에 암호화 데이터를 보낸다</title>
  <style>
    .tlsh-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tlsh-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tlsh-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tlsh-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tlsh-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tlsh-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tlsh-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tlsh-dash { stroke-dasharray: 5 4; }
    .tlsh-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tlsh-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="tlsh-tls13-handshake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tlsh-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="tlsh-life" x1="110" y1="56" x2="110" y2="304"/>
  <line class="tlsh-life" x1="370" y1="56" x2="370" y2="304"/>
  <rect class="tlsh-blue" x="50" y="20" width="120" height="36" rx="8"/>
  <text class="tlsh-t" x="110" y="38">클라이언트</text>
  <rect class="tlsh-green" x="310" y="20" width="120" height="36" rx="8"/>
  <text class="tlsh-t" x="370" y="38">서버</text>
  <text class="tlsh-msg" x="240" y="73">ClientHello (+ 키 공유)</text>
  <line class="tlsh-line" x1="110" y1="84" x2="369" y2="84" marker-end="url(#tlsh-tls13-handshake-arrow)"/>
  <rect class="tlsh-group" x="310" y="100" width="120" height="30" rx="6"/>
  <text class="tlsh-msg" x="370" y="115">키 합의 완료</text>
  <text class="tlsh-msg" x="240" y="147">ServerHello (+ 키 공유)</text>
  <line class="tlsh-line" x1="370" y1="158" x2="111" y2="158" marker-end="url(#tlsh-tls13-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="187">암호화된 {Certificate, Finished}</text>
  <line class="tlsh-line" x1="370" y1="198" x2="111" y2="198" marker-end="url(#tlsh-tls13-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="227">암호화된 {Finished}</text>
  <line class="tlsh-line" x1="110" y1="238" x2="369" y2="238" marker-end="url(#tlsh-tls13-handshake-arrow)"/>
  <rect class="tlsh-group" x="40" y="254" width="400" height="30" rx="6"/>
  <text class="tlsh-msg" x="240" y="269">1-RTT 만에 암호화 데이터</text>
</svg>
