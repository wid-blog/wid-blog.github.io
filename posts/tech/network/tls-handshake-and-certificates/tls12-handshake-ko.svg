<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 574" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tlsh-tls12-handshake-title">
  <title id="tlsh-tls12-handshake-title">TLS 1.2 핸드셰이크 — Hello 와 인증서, 키 교환을 거쳐 Finished 를 주고받은 뒤 암호화 통신을 시작한다</title>
  <style>
    .tlsh-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsh-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tlsh-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tlsh-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tlsh-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tlsh-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tlsh-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tlsh-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tlsh-dash { stroke-dasharray: 5 4; }
    .tlsh-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tlsh-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="tlsh-tls12-handshake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tlsh-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="tlsh-life" x1="100" y1="56" x2="100" y2="554"/>
  <line class="tlsh-life" x1="380" y1="56" x2="380" y2="554"/>
  <rect class="tlsh-blue" x="40" y="20" width="120" height="36" rx="8"/>
  <text class="tlsh-t" x="100" y="38">클라이언트</text>
  <rect class="tlsh-green" x="320" y="20" width="120" height="36" rx="8"/>
  <text class="tlsh-t" x="380" y="38">서버</text>
  <text class="tlsh-msg" x="240" y="73">ClientHello</text>
  <text class="tlsh-msg" x="240" y="91">(버전, 암호 스위트 목록, 클라이언트 랜덤)</text>
  <line class="tlsh-line" x1="100" y1="102" x2="379" y2="102" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="131">ServerHello</text>
  <text class="tlsh-msg" x="240" y="149">(선택된 암호 스위트, 서버 랜덤)</text>
  <line class="tlsh-line" x1="380" y1="160" x2="101" y2="160" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="189">Certificate</text>
  <text class="tlsh-msg" x="240" y="207">(서버 공개키)</text>
  <line class="tlsh-line" x1="380" y1="218" x2="101" y2="218" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="247">ServerKeyExchange</text>
  <text class="tlsh-msg" x="240" y="265">(ECDHE 공개값 + 서명)</text>
  <line class="tlsh-line" x1="380" y1="276" x2="101" y2="276" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="305">ServerHelloDone</text>
  <line class="tlsh-line" x1="380" y1="316" x2="101" y2="316" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="345">ClientKeyExchange</text>
  <text class="tlsh-msg" x="240" y="363">(ECDHE 공개값)</text>
  <line class="tlsh-line" x1="100" y1="374" x2="379" y2="374" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <rect class="tlsh-group" x="30" y="390" width="420" height="30" rx="6"/>
  <text class="tlsh-msg" x="240" y="405">양쪽이 같은 대칭키 유도</text>
  <text class="tlsh-msg" x="240" y="437">ChangeCipherSpec + Finished</text>
  <line class="tlsh-line" x1="100" y1="448" x2="379" y2="448" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <text class="tlsh-msg" x="240" y="477">ChangeCipherSpec + Finished</text>
  <line class="tlsh-line" x1="380" y1="488" x2="101" y2="488" marker-end="url(#tlsh-tls12-handshake-arrow)"/>
  <rect class="tlsh-group" x="30" y="504" width="420" height="30" rx="6"/>
  <text class="tlsh-msg" x="240" y="519">암호화된 애플리케이션 데이터</text>
</svg>
