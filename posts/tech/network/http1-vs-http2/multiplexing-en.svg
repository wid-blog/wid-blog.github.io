<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 462" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="h12-multiplexing-title">
  <title id="h12-multiplexing-title">HTTP/2 multiplexing — three requests go out back to back on one connection, and response frames return interleaved by stream</title>
  <style>
    .h12-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .h12-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .h12-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .h12-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .h12-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .h12-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .h12-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .h12-dash { stroke-dasharray: 5 4; }
    .h12-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .h12-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="h12-multiplexing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="h12-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="h12-life" x1="110" y1="56" x2="110" y2="442"/>
  <line class="h12-life" x1="370" y1="56" x2="370" y2="442"/>
  <rect class="h12-blue" x="50" y="20" width="120" height="36" rx="8"/>
  <text class="h12-t" x="110" y="38">Client</text>
  <rect class="h12-green" x="310" y="20" width="120" height="36" rx="8"/>
  <text class="h12-t" x="370" y="38">Server</text>
  <rect class="h12-group" x="40" y="84" width="400" height="30" rx="6"/>
  <text class="h12-msg" x="240" y="99">HTTP/2 — Multiplexing</text>
  <text class="h12-msg" x="240" y="131">Stream 1: GET /style.css</text>
  <line class="h12-line" x1="110" y1="142" x2="369" y2="142" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="171">Stream 3: GET /script.js</text>
  <line class="h12-line" x1="110" y1="182" x2="369" y2="182" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="211">Stream 5: GET /image.png</text>
  <line class="h12-line" x1="110" y1="222" x2="369" y2="222" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="251">Stream 3: script.js (partial)</text>
  <line class="h12-line h12-dash" x1="370" y1="262" x2="111" y2="262" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="291">Stream 1: style.css (complete)</text>
  <line class="h12-line h12-dash" x1="370" y1="302" x2="111" y2="302" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="331">Stream 5: image.png (partial)</text>
  <line class="h12-line h12-dash" x1="370" y1="342" x2="111" y2="342" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="371">Stream 3: script.js (complete)</text>
  <line class="h12-line h12-dash" x1="370" y1="382" x2="111" y2="382" marker-end="url(#h12-multiplexing-arrow)"/>
  <text class="h12-msg" x="240" y="411">Stream 5: image.png (complete)</text>
  <line class="h12-line h12-dash" x1="370" y1="422" x2="111" y2="422" marker-end="url(#h12-multiplexing-arrow)"/>
</svg>
