<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 298" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="h12-framing-title">
  <title id="h12-framing-title">텍스트 메시지와 바이너리 프레임 — HTTP/1.1 은 요청 하나가 텍스트 한 덩어리, HTTP/2 는 스트림 번호가 붙은 HEADERS·DATA 프레임으로 나뉜다</title>
  <style>
    .h12-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .h12-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .h12-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .h12-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .h12-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .h12-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .h12-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .h12-dash { stroke-dasharray: 5 4; }
    .h12-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .h12-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="h12-framing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="h12-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="h12-group" x="16" y="20" width="448" height="126" rx="12"/>
  <text class="h12-sub" x="28" y="40">HTTP/1.1</text>
  <rect class="h12-amber" x="28" y="56" width="424" height="74" rx="8"/>
  <text class="h12-mono" x="44" y="75">GET /index.html HTTP/1.1</text>
  <text class="h12-mono" x="44" y="93">Host: example.com</text>
  <text class="h12-mono" x="44" y="111">Accept: text/html</text>
  <rect class="h12-group" x="16" y="170" width="448" height="108" rx="12"/>
  <text class="h12-sub" x="28" y="190">HTTP/2</text>
  <rect class="h12-green" x="28" y="206" width="136" height="56" rx="8"/>
  <text class="h12-t" x="96" y="225">HEADERS 프레임</text>
  <text class="h12-t" x="96" y="243">(스트림 1)</text>
  <rect class="h12-green" x="172" y="206" width="136" height="56" rx="8"/>
  <text class="h12-t" x="240" y="225">DATA 프레임</text>
  <text class="h12-t" x="240" y="243">(스트림 1)</text>
  <rect class="h12-green" x="316" y="206" width="136" height="56" rx="8"/>
  <text class="h12-t" x="384" y="225">HEADERS 프레임</text>
  <text class="h12-t" x="384" y="243">(스트림 3)</text>
</svg>
