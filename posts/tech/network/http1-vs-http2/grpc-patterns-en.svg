<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 428" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="h12-grpc-patterns-title">
  <title id="h12-grpc-patterns-title">The four gRPC communication patterns — split by whether there is one or many request and response messages</title>
  <style>
    .h12-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h12-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .h12-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .h12-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .h12-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .h12-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .h12-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .h12-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .h12-dash { stroke-dasharray: 5 4; }
    .h12-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .h12-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="h12-grpc-patterns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="h12-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="h12-group" x="20" y="20" width="440" height="88" rx="12"/>
  <text class="h12-sub" x="36" y="40">Unary</text>
  <rect class="h12-blue" x="36" y="56" width="96" height="36" rx="8"/>
  <text class="h12-t" x="84" y="74">Client</text>
  <rect class="h12-green" x="348" y="56" width="96" height="36" rx="8"/>
  <text class="h12-t" x="396" y="74">Server</text>
  <text class="h12-msg" x="240" y="63">1 req / 1 res</text>
  <line class="h12-line" x1="132" y1="74" x2="347" y2="74" marker-end="url(#h12-grpc-patterns-arrow)"/>
  <rect class="h12-group" x="20" y="120" width="440" height="88" rx="12"/>
  <text class="h12-sub" x="36" y="140">Server Streaming</text>
  <rect class="h12-blue" x="36" y="156" width="96" height="36" rx="8"/>
  <text class="h12-t" x="84" y="174">Client</text>
  <rect class="h12-green" x="348" y="156" width="96" height="36" rx="8"/>
  <text class="h12-t" x="396" y="174">Server</text>
  <text class="h12-msg" x="240" y="163">1 req / N res</text>
  <line class="h12-line" x1="132" y1="174" x2="347" y2="174" marker-end="url(#h12-grpc-patterns-arrow)"/>
  <rect class="h12-group" x="20" y="220" width="440" height="88" rx="12"/>
  <text class="h12-sub" x="36" y="240">Client Streaming</text>
  <rect class="h12-blue" x="36" y="256" width="96" height="36" rx="8"/>
  <text class="h12-t" x="84" y="274">Client</text>
  <rect class="h12-green" x="348" y="256" width="96" height="36" rx="8"/>
  <text class="h12-t" x="396" y="274">Server</text>
  <text class="h12-msg" x="240" y="263">N req / 1 res</text>
  <line class="h12-line" x1="132" y1="274" x2="347" y2="274" marker-end="url(#h12-grpc-patterns-arrow)"/>
  <rect class="h12-group" x="20" y="320" width="440" height="88" rx="12"/>
  <text class="h12-sub" x="36" y="340">Bidirectional Streaming</text>
  <rect class="h12-blue" x="36" y="356" width="96" height="36" rx="8"/>
  <text class="h12-t" x="84" y="374">Client</text>
  <rect class="h12-green" x="348" y="356" width="96" height="36" rx="8"/>
  <text class="h12-t" x="396" y="374">Server</text>
  <text class="h12-msg" x="240" y="363">N req / N res</text>
  <line class="h12-line" x1="132" y1="374" x2="347" y2="374" marker-end="url(#h12-grpc-patterns-arrow)"/>
</svg>
