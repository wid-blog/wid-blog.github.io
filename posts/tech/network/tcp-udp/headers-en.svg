<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 416" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tu-headers-title">
  <title id="tu-headers-title">The TCP header has eight fields and 20+ bytes; the UDP header has four fields and 8 bytes</title>
  <style>
    .tu-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tu-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tu-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tu-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tu-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tu-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tu-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tu-dash { stroke-dasharray: 5 4; }
    .tu-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tu-head { fill: var(--secondary); }
    .tu-plot { stroke: rgb(70, 130, 220); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="tu-headers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tu-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="tu-group" x="20" y="20" width="440" height="220" rx="12"/>
  <text class="tu-sub" x="36" y="40">TCP Header (20+ bytes)</text>
  <rect class="tu-blue" x="36" y="56" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="74">Source Port</text>
  <rect class="tu-blue" x="246" y="56" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="74">Dest Port</text>
  <rect class="tu-blue" x="36" y="100" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="118">Sequence Number</text>
  <rect class="tu-blue" x="246" y="100" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="118">ACK Number</text>
  <rect class="tu-blue" x="36" y="144" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="162">Flags</text>
  <rect class="tu-blue" x="246" y="144" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="162">Window Size</text>
  <rect class="tu-blue" x="36" y="188" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="206">Checksum</text>
  <rect class="tu-blue" x="246" y="188" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="206">Options...</text>
  <rect class="tu-group" x="20" y="264" width="440" height="132" rx="12"/>
  <text class="tu-sub" x="36" y="284">UDP Header (8 bytes)</text>
  <rect class="tu-green" x="36" y="300" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="318">Source Port</text>
  <rect class="tu-green" x="246" y="300" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="318">Dest Port</text>
  <rect class="tu-green" x="36" y="344" width="198" height="36" rx="8"/>
  <text class="tu-t" x="135" y="362">Length</text>
  <rect class="tu-green" x="246" y="344" width="198" height="36" rx="8"/>
  <text class="tu-t" x="345" y="362">Checksum</text>
</svg>
