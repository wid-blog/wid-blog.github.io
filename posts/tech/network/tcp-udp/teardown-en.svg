<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 486" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tu-teardown-title">
  <title id="tu-teardown-title">TCP 4-way handshake — each direction is closed separately with FIN and ACK</title>
  <style>
    .tu-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tu-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tu-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tu-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tu-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tu-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tu-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tu-dash { stroke-dasharray: 5 4; }
    .tu-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tu-head { fill: var(--secondary); }
    .tu-plot { stroke: rgb(70, 130, 220); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="tu-teardown-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tu-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="tu-life" x1="150" y1="56" x2="150" y2="466"/>
  <line class="tu-life" x1="330" y1="56" x2="330" y2="466"/>
  <rect class="tu-blue" x="90" y="20" width="120" height="36" rx="8"/>
  <text class="tu-t" x="150" y="38">Initiator</text>
  <rect class="tu-green" x="270" y="20" width="120" height="36" rx="8"/>
  <text class="tu-t" x="330" y="38">Peer</text>
  <text class="tu-msg" x="240" y="73">FIN</text>
  <line class="tu-line" x1="150" y1="84" x2="329" y2="84" marker-end="url(#tu-teardown-arrow)"/>
  <rect class="tu-group" x="340" y="100" width="120" height="48" rx="6"/>
  <text class="tu-msg" x="400" y="115">FIN received,</text>
  <text class="tu-msg" x="400" y="133">inbound closed</text>
  <text class="tu-msg" x="240" y="165">ACK</text>
  <line class="tu-line" x1="330" y1="176" x2="151" y2="176" marker-end="url(#tu-teardown-arrow)"/>
  <rect class="tu-group" x="260" y="192" width="140" height="48" rx="6"/>
  <text class="tu-msg" x="330" y="207">Finishes sending</text>
  <text class="tu-msg" x="330" y="225">remaining data</text>
  <text class="tu-msg" x="240" y="257">FIN</text>
  <line class="tu-line" x1="330" y1="268" x2="151" y2="268" marker-end="url(#tu-teardown-arrow)"/>
  <rect class="tu-group" x="20" y="284" width="120" height="48" rx="6"/>
  <text class="tu-msg" x="80" y="299">FIN received,</text>
  <text class="tu-msg" x="80" y="317">outbound closed</text>
  <text class="tu-msg" x="240" y="349">ACK</text>
  <line class="tu-line" x1="150" y1="360" x2="329" y2="360" marker-end="url(#tu-teardown-arrow)"/>
  <rect class="tu-group" x="60" y="376" width="180" height="30" rx="6"/>
  <text class="tu-msg" x="150" y="391">Enters TIME_WAIT state</text>
  <rect class="tu-group" x="80" y="416" width="320" height="30" rx="6"/>
  <text class="tu-msg" x="240" y="431">Connection released</text>
</svg>
