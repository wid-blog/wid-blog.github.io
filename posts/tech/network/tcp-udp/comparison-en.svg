<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.5 -10 1112.8 234.6" width="100%" style="display: block; max-width: 1112.8px; margin: 0 auto" role="img" aria-labelledby="comparison-title">
  <title id="comparison-title">Comparison</title>
