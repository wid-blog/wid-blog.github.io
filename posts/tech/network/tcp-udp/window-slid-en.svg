<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 176" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tu-window-slid-title">
  <title id="tu-window-slid-title">After ACK 3 — segment 3 is acknowledged and the window slides one step right to 4–7</title>
  <style>
    .tu-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tu-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tu-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tu-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tu-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tu-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tu-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tu-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tu-dash { stroke-dasharray: 5 4; }
    .tu-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tu-head { fill: var(--secondary); }
    .tu-plot { stroke: rgb(70, 130, 220); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="tu-window-slid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tu-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="tu-green" x="20" y="56" width="76" height="36" rx="8"/>
  <text class="tu-t" x="58" y="74">3 ✓</text>
  <rect class="tu-group" x="108" y="20" width="352" height="84" rx="12"/>
  <text class="tu-sub" x="124" y="40">Send Window (rwnd = 4)</text>
  <rect class="tu-blue" x="120" y="56" width="76" height="36" rx="8"/>
  <text class="tu-t" x="158" y="74">4 sent</text>
  <rect class="tu-blue" x="204" y="56" width="76" height="36" rx="8"/>
  <text class="tu-t" x="242" y="74">5 sent</text>
  <rect class="tu-group" x="288" y="56" width="76" height="36" rx="8"/>
  <text class="tu-t" x="326" y="74">6 ready</text>
  <rect class="tu-group" x="372" y="56" width="76" height="36" rx="8"/>
  <text class="tu-t" x="410" y="74">7 ready</text>
  <rect class="tu-group" x="20" y="120" width="76" height="36" rx="8"/>
  <text class="tu-t" x="58" y="138">8</text>
  <rect class="tu-group" x="120" y="120" width="76" height="36" rx="8"/>
  <text class="tu-t" x="158" y="138">9</text>
  <rect class="tu-group" x="204" y="120" width="76" height="36" rx="8"/>
  <text class="tu-t" x="242" y="138">10</text>
  <rect class="tu-group" x="288" y="120" width="76" height="36" rx="8"/>
  <text class="tu-t" x="326" y="138">11</text>
  <rect class="tu-group" x="372" y="120" width="76" height="36" rx="8"/>
  <text class="tu-t" x="410" y="138">12</text>
</svg>
