<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 378" width="100%" style="display: block; max-width: 480px; margin: 0 auto" role="img" aria-labelledby="tlsp-session-resumption-title">
  <title id="tlsp-session-resumption-title">Session resumption — reconnecting with the ticket from the first handshake skips key agreement</title>
  <style>
    .tlsp-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsp-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .tlsp-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .tlsp-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .tlsp-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .tlsp-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .tlsp-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .tlsp-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .tlsp-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .tlsp-dash { stroke-dasharray: 5 4; }
    .tlsp-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .tlsp-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="tlsp-session-resumption-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="tlsp-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="tlsp-life" x1="110" y1="56" x2="110" y2="358"/>
  <line class="tlsp-life" x1="370" y1="56" x2="370" y2="358"/>
  <rect class="tlsp-blue" x="50" y="20" width="120" height="36" rx="8"/>
  <text class="tlsp-t" x="110" y="38">Client</text>
  <rect class="tlsp-green" x="310" y="20" width="120" height="36" rx="8"/>
  <text class="tlsp-t" x="370" y="38">Server</text>
  <rect class="tlsp-group" x="40" y="84" width="400" height="30" rx="6"/>
  <text class="tlsp-msg" x="240" y="99">Initial handshake</text>
  <text class="tlsp-msg" x="240" y="131">NewSessionTicket</text>
  <text class="tlsp-msg" x="240" y="149">(issues session ticket)</text>
  <line class="tlsp-line" x1="370" y1="160" x2="111" y2="160" marker-end="url(#tlsp-session-resumption-arrow)"/>
  <rect class="tlsp-group" x="40" y="176" width="400" height="30" rx="6"/>
  <text class="tlsp-msg" x="240" y="191">── later reconnection ──</text>
  <text class="tlsp-msg" x="240" y="223">ClientHello + ticket / PSK</text>
  <line class="tlsp-line" x1="110" y1="234" x2="369" y2="234" marker-end="url(#tlsp-session-resumption-arrow)"/>
  <text class="tlsp-msg" x="240" y="263">ServerHello</text>
  <text class="tlsp-msg" x="240" y="281">(key agreement skipped)</text>
  <line class="tlsp-line" x1="370" y1="292" x2="111" y2="292" marker-end="url(#tlsp-session-resumption-arrow)"/>
  <rect class="tlsp-group" x="40" y="308" width="400" height="30" rx="6"/>
  <text class="tlsp-msg" x="240" y="323">Resumed via abbreviated handshake</text>
</svg>
