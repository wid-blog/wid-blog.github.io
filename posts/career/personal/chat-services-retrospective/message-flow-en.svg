<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 538" width="100%" style="display: block; max-width: 560px; margin: 0 auto" role="img" aria-labelledby="chs-message-flow-title">
  <title id="chs-message-flow-title">Message flow — stored, published to Kafka, received by MessageBroker via OnReceive, then delivered to the room's WebSocket clients</title>
  <style>
    .chs-t { fill: var(--primary); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .chs-msg { fill: var(--primary); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .chs-sub { fill: var(--secondary); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; dominant-baseline: central; }
    .chs-mono { fill: var(--primary); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; dominant-baseline: central; }
    .chs-group { fill: rgba(128, 128, 128, 0.06); stroke: var(--tertiary); stroke-width: 1; }
    .chs-blue { fill: rgba(70, 130, 220, 0.14); stroke: rgb(70, 130, 220); stroke-width: 1; }
    .chs-green { fill: rgba(60, 160, 90, 0.14); stroke: rgb(60, 160, 90); stroke-width: 1; }
    .chs-amber { fill: rgba(220, 130, 40, 0.14); stroke: rgb(220, 130, 40); stroke-width: 1; }
    .chs-line { stroke: var(--secondary); stroke-width: 1.25; fill: none; }
    .chs-dash { stroke-dasharray: 5 4; }
    .chs-life { stroke: var(--tertiary); stroke-width: 1; stroke-dasharray: 3 4; }
    .chs-head { fill: var(--secondary); }
  </style>
  <defs>
    <marker id="chs-message-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path class="chs-head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>
  <line class="chs-life" x1="85" y1="76" x2="85" y2="518"/>
  <line class="chs-life" x1="163" y1="122" x2="163" y2="518"/>
  <line class="chs-life" x1="241" y1="56" x2="241" y2="518"/>
  <line class="chs-life" x1="319" y1="122" x2="319" y2="518"/>
  <line class="chs-life" x1="397" y1="56" x2="397" y2="518"/>
  <line class="chs-life" x1="475" y1="122" x2="475" y2="518"/>
  <rect class="chs-blue" x="20" y="20" width="130" height="56" rx="8"/>
  <text class="chs-t" x="85" y="39">WebSocket</text>
  <text class="chs-t" x="85" y="57">Client</text>
  <rect class="chs-green" x="98" y="86" width="130" height="36" rx="8"/>
  <text class="chs-t" x="163" y="104">SendUseCase</text>
  <rect class="chs-green" x="176" y="20" width="130" height="36" rx="8"/>
  <text class="chs-t" x="241" y="38">MongoDB</text>
  <rect class="chs-green" x="254" y="86" width="130" height="36" rx="8"/>
  <text class="chs-t" x="319" y="104">Kafka</text>
  <rect class="chs-green" x="332" y="20" width="130" height="36" rx="8"/>
  <text class="chs-t" x="397" y="38">MessageBroker</text>
  <rect class="chs-green" x="410" y="86" width="130" height="36" rx="8"/>
  <text class="chs-t" x="475" y="104">RoomManager</text>
  <text class="chs-msg" x="124" y="139">Send</text>
  <text class="chs-msg" x="124" y="157">message</text>
  <line class="chs-line" x1="85" y1="168" x2="162" y2="168" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="202" y="197">Store</text>
  <text class="chs-msg" x="202" y="215">message</text>
  <line class="chs-line" x1="163" y1="226" x2="240" y2="226" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="202" y="255">Kafka</text>
  <text class="chs-msg" x="202" y="273">publish</text>
  <line class="chs-line" x1="163" y1="284" x2="318" y2="284" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="358" y="313">Consumer</text>
  <text class="chs-msg" x="358" y="331">receives</text>
  <line class="chs-line" x1="319" y1="342" x2="396" y2="342" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="358" y="371">OnReceive</text>
  <text class="chs-msg" x="358" y="389">callback</text>
  <line class="chs-line" x1="397" y1="400" x2="164" y2="400" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="202" y="429">Broadcast</text>
  <line class="chs-line" x1="163" y1="440" x2="474" y2="440" marker-end="url(#chs-message-flow-arrow)"/>
  <text class="chs-msg" x="436" y="469">WebSocket</text>
  <text class="chs-msg" x="436" y="487">delivery</text>
  <line class="chs-line" x1="475" y1="498" x2="86" y2="498" marker-end="url(#chs-message-flow-arrow)"/>
</svg>
